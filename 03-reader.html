<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משניון — קורא</title>
<style>
:root{--bg:#EEEDE8;--card:#fff;--text:#1A1A1A;--text-sec:#6B6B6B;--text-muted:#9E9E9E;--border:rgba(0,0,0,.12);--primary:#3A7D44;--primary-light:#E9F2E9;--surface:#F5F5F3;--green:#3B8C14;--verse-bg:#FAFAF8;}
html.dark{--bg:#111;--card:#1E1E1E;--text:#F0EFE9;--text-sec:#ABABAB;--text-muted:#666;--border:rgba(255,255,255,.09);--primary:#6FBF7A;--primary-light:#15291B;--surface:#272727;--green:#5DBF35;--verse-bg:#1A1A1A;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;direction:rtl;}
.app{max-width:430px;width:100%;background:var(--card);height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:0;z-index:20;flex-shrink:0;}
.topbar-center{flex:1;text-align:center;}
.chap-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.2;}
.chap-ref{font-size:11px;color:var(--text-muted);margin-top:1px;}
.back-btn{font-size:15px;color:var(--primary);border:1px solid var(--primary);background:var(--primary-light);border-radius:20px;padding:7px 16px;text-decoration:none;flex-shrink:0;white-space:nowrap;font-weight:600;}
.topbar-actions{display:flex;gap:8px;flex-shrink:0;}
.topbar-spacer{width:56px;flex-shrink:0;}
.reader-toolbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:5px 12px;border-bottom:.5px solid var(--border);background:var(--card);flex-shrink:0;}
.reader-toolbar .icon-btn{width:100%;height:32px;border-radius:9px;font-size:16px;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
#aaBtn{font-size:13px;font-weight:700;font-family:system-ui,sans-serif;letter-spacing:-.5px;}
.icon-btn.active{background:var(--primary-light);border-color:var(--primary);}
.icon-btn.mem-active{background:#F0EAFF;border-color:#5B2DA0;}
html.dark .icon-btn.mem-active{background:#1E1435;border-color:#9B6FE0;}
#memBtn{color:#5B2DA0;font-size:21px;}
html.dark #memBtn{color:#9B6FE0;}

/* Nav bar */
.navbar{display:flex;align-items:center;justify-content:space-between;padding:5px 16px;border-bottom:.5px solid var(--border);background:var(--surface);}
.nav-btn{width:34px;height:34px;border-radius:10px;border:.5px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text);-webkit-tap-highlight-color:transparent;transition:opacity .15s;}
.nav-btn:disabled{opacity:.3;cursor:default;}
.nav-center{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.chap-num-display{font-size:13px;font-weight:600;color:var(--text);text-align:center;}
.mode-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--primary-light);color:var(--primary);font-weight:500;}

/* Controls — סגור כברירת מחדל, נפתח עם Aa */
.controls{display:none;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:.5px solid var(--border);}
.controls.open{display:flex;}
.font-btns{display:flex;gap:4px;}
.font-controls{display:flex;align-items:center;gap:6px;}
.font-step-btn{width:30px;height:30px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .15s;font-family:system-ui,sans-serif;}
.font-step-btn:active{background:var(--primary-light);}
.font-size-val{font-size:12px;color:var(--text-muted);min-width:28px;text-align:center;}
.scroll-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sec);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
.toggle-sw{width:34px;height:20px;border-radius:10px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;}
.toggle-sw.on{background:var(--primary);}
.toggle-sw::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;right:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-sw.on::after{transform:translateX(-14px);}

/* Text area */
.text-area{flex:1;overflow-y:auto;padding:16px;background:var(--verse-bg);}
.loading-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text-muted);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.verse{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;}
.verse-num{font-size:11px;color:var(--text-muted);min-width:18px;text-align:center;margin-top:4px;flex-shrink:0;}
.verse-content{flex:1;display:flex;flex-direction:column;}
.verse-text{line-height:1.75;color:var(--text);font-family:'David Libre','FrankRuehl','Times New Roman',serif;text-align:right;}
.verse-text{font-size:18px;} /* גודל ברירת מחדל — ידרס ב-inline style */
.error-msg{padding:30px 20px;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.6;}
.retry-btn{margin-top:12px;display:inline-block;padding:8px 22px;background:var(--primary-light);color:var(--primary);border:.5px solid var(--primary);border-radius:20px;cursor:pointer;font-size:13px;}

/* Bottom bar */
.bottombar{border-top:.5px solid var(--border);padding:7px 16px calc(9px + env(safe-area-inset-bottom, 0px));background:var(--card);flex-shrink:0;}
.idle-warning{font-size:11px;color:#C07A00;display:none;text-align:center;margin-bottom:8px;padding:5px;background:rgba(192,122,0,.08);border-radius:8px;}
/* Scroll progress */
.read-progress-wrap{height:4px;background:var(--border);border-radius:2px;margin-bottom:7px;overflow:hidden;}
.read-progress-bar{height:100%;width:0%;background:var(--primary);border-radius:2px;transition:width .15s;}
.read-progress-bar.full{background:var(--green);}
.done-btn{width:100%;padding:8px 14px;border-radius:13px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,opacity .2s;display:flex;flex-direction:column;align-items:center;gap:1px;}
.done-btn:active{opacity:.85;}
.done-btn.done{background:var(--green);}
.done-btn.locked{background:transparent;color:var(--text-muted);border:none;cursor:default;pointer-events:none;}
.done-btn-meta{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;width:100%;opacity:.92;}
.done-btn-meta .meta-timer{color:#1a1a1a;}
.done-btn-meta .meta-score{color:#c8960c;}
.done-btn.locked .done-btn-meta .meta-timer{color:var(--text-muted);}
.done-btn.locked .done-btn-meta .meta-score{color:#c8960c;opacity:.5;}
.quick-confirm{display:flex;gap:8px;width:100%;}
.quick-confirm button{flex:1;padding:13px 8px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;}
.qc-continue{background:var(--primary);color:#fff;}
.qc-back{background:var(--surface);color:var(--text);border:.5px solid var(--border)!important;}

/* ── Shinun (memorization) mode ── */
.shinun-bar{display:none;gap:6px;padding:8px 12px;background:#F5F0FF;border-bottom:.5px solid #C8B0F0;flex-wrap:wrap;}
html.dark .shinun-bar{background:#1C1235;border-bottom-color:#4A3080;}
.shinun-bar.open{display:flex;}
.shinun-lvl{flex:1 1 28%;min-width:88px;padding:7px 6px;border-radius:10px;border:1px solid #C8B0F0;background:var(--card);font-size:11px;font-weight:600;color:#7B2FF7;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:all .15s;line-height:1.3;}
.rt-word{cursor:pointer;border-bottom:1px dotted #B79BE8;-webkit-tap-highlight-color:transparent;}
.rt-word.revealed{border-bottom:none;color:var(--primary);}
html.dark .shinun-lvl{border-color:#5B3090;color:#9B6FE0;}
.shinun-lvl.active{background:#7B2FF7;color:#fff;border-color:#7B2FF7;}
/* Cover block (level 2) */
.cover-block{display:inline-block;background:#7B2FF7;border-radius:4px;color:transparent;cursor:pointer;user-select:none;padding:0 4px;min-width:40px;transition:all .25s;vertical-align:baseline;}
.cover-block.revealed{background:transparent;color:var(--text);}
/* Hint row (level 3) */
.shinun-hint{font-size:11px;color:#7B2FF7;margin-top:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
html.dark .shinun-hint{color:#9B6FE0;}
.verse-wrap{cursor:default;}
.verse-wrap.tappable{cursor:pointer;}
/* Test mode (level 4) */
.verse-hidden-label{font-size:13px;color:var(--text-muted);padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.assess-row{display:flex;gap:6px;margin-top:8px;}
.assess-btn{flex:1;padding:7px 4px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
.assess-yes{background:#EBF5E5;color:#3B8C14;}
.assess-no{background:#FFF0F0;color:#C04040;}
/* Shinun score banner */
.shinun-score-banner{margin:12px 16px 0;padding:12px 16px;border-radius:12px;background:#F5F0FF;border:1px solid #C8B0F0;font-size:13px;color:#7B2FF7;font-weight:600;text-align:center;display:none;}
html.dark .shinun-score-banner{background:#1C1235;border-color:#5B3090;color:#9B6FE0;}
.shinun-retry-btn{display:inline-block;margin-top:10px;padding:9px 18px;border-radius:20px;border:none;background:#7B2FF7;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;}
.shinun-retry-btn:active{transform:scale(.96);}
.shinun-mastery{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:700;}
/* mastery badge on verse number */
.mastery-pip{font-size:10px;margin-top:2px;}
/* TTS active + currently-speaking verse highlight */
.icon-btn.tts-on{background:#7B2FF7;color:#fff;border-color:#7B2FF7;}
.verse.tts-speaking{background:#F5F0FF;border-radius:8px;}
html.dark .verse.tts-speaking{background:#241636;}
.verse.verse-flash{animation:verseFlash 1.7s ease-out;border-radius:8px;}
@keyframes verseFlash{0%,30%{background:rgba(58,125,68,.22);}100%{background:transparent;}}

/* Dedication banner */
.dedication-banner{display:flex;align-items:center;gap:10px;padding:9px 16px;background:linear-gradient(135deg,#E9F2E9,#DCF0DE);border-bottom:.5px solid #BBD6BB;flex-shrink:0;}
html.dark .dedication-banner{background:linear-gradient(135deg,#15291B,#0E1E14);border-bottom-color:#2E5E34;}
.ded-icon{font-size:16px;flex-shrink:0;}
.ded-text{flex:1;font-size:13px;font-weight:700;color:var(--primary);line-height:1.3;}
.ded-sub{font-size:10px;font-weight:400;color:var(--primary);opacity:.75;display:block;margin-top:1px;}
.ded-close{width:26px;height:26px;border-radius:50%;border:.5px solid var(--primary);background:transparent;cursor:pointer;font-size:13px;color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.65;-webkit-tap-highlight-color:transparent;transition:opacity .15s;}
.ded-close:active{opacity:1;}

/* Commentary */
.commentary-bar{display:flex;gap:6px;padding:7px 16px;background:var(--surface);border-bottom:.5px solid var(--border);}
.comm-type-btn{flex:1;padding:6px 10px;border-radius:20px;border:.5px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;color:var(--text-sec);font-family:system-ui,sans-serif;transition:background .15s;}
.comm-type-btn.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary);font-weight:600;}
.audio-bar{display:none;gap:6px;padding:8px 12px;background:#EAF3FF;border-bottom:.5px solid #B9D3F0;}
html.dark .audio-bar{background:#0E2034;border-bottom-color:#274869;}
.audio-bar.open{display:flex;}
.audio-opt{flex:1;padding:7px 4px;border-radius:10px;border:1px solid #B9D3F0;background:var(--card);font-size:11px;font-weight:600;color:#1E6FB8;cursor:pointer;text-align:center;line-height:1.3;-webkit-tap-highlight-color:transparent;font-family:inherit;}
html.dark .audio-opt{border-color:#274869;color:#7FB6E8;}
.audio-opt.playing{background:#1E6FB8;color:#fff;border-color:#1E6FB8;}
.audio-opt.stop{color:#B03020;border-color:#E0B0A8;}
.verse-commentary{margin-top:8px;padding:9px 11px;background:var(--primary-light);border-radius:8px;border-right:3px solid var(--primary);font-size:13.5px;line-height:1.7;color:var(--text-sec);font-family:system-ui,sans-serif;}
.comm-source{font-size:10px;color:var(--primary);font-weight:700;margin-bottom:4px;display:block;}
.comm-loading{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:8px;text-align:center;padding:6px;}

/* Medal popup */
.medal-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.medal-popup{background:var(--card);width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:28px 24px calc(36px + 62px + env(safe-area-inset-bottom, 0px));text-align:center;animation:medalSlideUp .4s cubic-bezier(.16,1,.3,1);}
@keyframes medalSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.medal-popup-emoji{font-size:64px;line-height:1;display:block;margin-bottom:12px;animation:medalBounce .6s .35s both;}
@keyframes medalBounce{0%{transform:scale(0.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.medal-popup-title{font-size:12px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;}
.medal-popup-name{font-size:24px;font-weight:800;margin-bottom:6px;}
.medal-popup-desc{font-size:13px;color:var(--text-sec);margin-bottom:20px;line-height:1.6;}
.medal-popup-btns{display:flex;gap:10px;}
.medal-popup-cert{flex:1;padding:13px;border-radius:14px;border:none;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:system-ui,sans-serif;}
.medal-popup-close{flex:1;padding:13px;border-radius:14px;border:.5px solid var(--border);background:var(--surface);font-size:14px;font-weight:600;color:var(--text-sec);cursor:pointer;font-family:system-ui,sans-serif;}

/* Verse bookmark button */
.verse-bk-btn{width:34px;height:34px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;opacity:.2;-webkit-tap-highlight-color:transparent;flex-shrink:0;transition:opacity .2s,transform .15s;font-family:system-ui,sans-serif;color:var(--text);}
.verse-bk-btn.saved{opacity:1;color:#C07A00;}
.verse-bk-btn.saved.pop{animation:bkPop .3s ease;}
.verse-mem-btn{width:30px;height:34px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:17px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;opacity:.28;-webkit-tap-highlight-color:transparent;flex-shrink:0;transition:opacity .2s,transform .15s;font-family:system-ui,sans-serif;color:var(--text);}
.verse-mem-btn.marked{opacity:1;color:#7B2FF7;}
.verse-mem-btn.marked.pop{animation:bkPop .3s ease;}
.verse-actions{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;}
.verse-actions > button{height:27px !important;}
.verse-rec-btn{width:30px;height:27px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:15px;display:none;align-items:center;justify-content:center;opacity:.5;-webkit-tap-highlight-color:transparent;flex-shrink:0;transition:opacity .2s;font-family:system-ui,sans-serif;}
body.reader-shinun .verse-rec-btn{display:flex;}
.verse-rec-btn.has-rec{opacity:1;color:#2E7D32;}
.verse-rec-btn.recording{opacity:1;color:#C0392B;animation:recPulse 1s infinite;}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes bkPop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

/* Toast */
.toast{position:fixed;bottom:57px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;z-index:100;white-space:nowrap;pointer-events:none;}
html.dark .toast{background:#F0EFE9;color:#1A1A1A;}
.toast.show{opacity:1;}
.toast.big{bottom:auto;top:46%;font-size:16px;font-weight:700;padding:18px 24px;border-radius:18px;max-width:300px;white-space:normal;text-align:center;line-height:1.6;box-shadow:0 10px 36px rgba(0,0,0,.32);background:var(--primary);color:#fff;}
html.dark .toast.big{background:var(--primary);color:#fff;}

/* Chapter select modal overlay */
.chap-picker{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.chap-picker-inner{background:var(--card);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:16px;max-height:60vh;display:flex;flex-direction:column;}
.chap-picker-title{font-size:16px;font-weight:700;color:var(--text);text-align:center;margin-bottom:12px;}
.chap-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;overflow-y:auto;flex:1;}
.chap-cell{padding:8px 4px;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;color:var(--text);text-align:center;-webkit-tap-highlight-color:transparent;}
.chap-cell.active-chap{background:var(--primary);color:#fff;border-color:var(--primary);}
.chap-cell.fav-chap{border-color:#E53935;color:#E53935;}
.chap-cell.mem-chap{border-color:var(--green);color:var(--green);}
.picker-close{margin-top:12px;padding:11px;border-radius:12px;border:.5px solid var(--border);background:var(--surface);width:100%;cursor:pointer;font-size:14px;color:var(--text-sec);}
</style>
<script src="i18n.js?v=2.2.86" defer></script>

<body>
<div class="app" id="app">

  <!-- Top bar -->
  <div class="topbar">
    <a href="01-dashboard.html" class="back-btn" data-i18n="read.back">← בית</a>
    <div class="topbar-center">
      <div class="chap-title" id="chapTitle">טוען...</div>
      <div class="chap-ref" id="chapRef"></div>
    </div>
    <button class="back-btn" onclick="navigateRandom()" title="משנה אקראית — דלג לפרק שטרם נלמד" style="font-family:inherit;cursor:pointer;">🎲 אקראי</button>
  </div>

  <!-- Action toolbar — 2 rows of buttons -->
  <div class="reader-toolbar">
    <button class="icon-btn" id="aaBtn" onclick="toggleControls()" title="גודל טקסט וגלילה">Aa</button>
    <button class="icon-btn" id="commBtn" onclick="toggleCommentary()" title="פירוש" data-i18n-title="read.commentary">📖</button>
    <button class="icon-btn" id="favBtn" onclick="toggleFav()" title="מועדף" data-i18n-title="read.favorite">🤍</button>
    <button class="icon-btn" id="memBtn" onclick="toggleMem()" title="שינון" data-i18n-title="read.memorize">☆</button>
    <button class="icon-btn" id="shinunModeBtn" onclick="toggleShinunMode()" title="מצב שינון" data-i18n-title="read.shinun_mode">🧠</button>
    <button class="icon-btn" id="ttsBtn" onclick="toggleTTS()" title="הקראה קולית">🔊</button>
  </div>

  <!-- Nav bar -->
  <div class="navbar">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" title="פרק קודם" data-i18n-title="read.prev_chap">▶</button>
    <div class="nav-center">
      <div style="display:flex;gap:7px;align-items:center;width:100%;justify-content:center;">
        <div class="chap-num-display" id="chapNumDisp" onclick="openPicker()" style="cursor:pointer;padding:9px 24px;border-radius:11px;background:var(--card);border:.5px solid var(--border);font-size:15px;font-weight:700;">בחר פרק ▾</div>
        <div class="chap-num-display" id="mishnahJumpBtn" onclick="openMishnahPicker()" title="קפוץ למשנה" style="cursor:pointer;padding:9px 20px;border-radius:11px;background:var(--card);border:.5px solid var(--border);font-size:15px;font-weight:700;">משנה ▾</div>
      </div>
      <div class="mode-badge" id="modeBadge" style="display:none"></div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" title="פרק הבא" data-i18n-title="read.next_chap">◀</button>

<script src="utils.js?v=2.2.0"></script>
<script src="corpus.js?v=1.0.1"></script>
<script src="gamification.js?v=2.2.84"></script>
<script>
/* ── Storage ── */
const S = {
  get:    k      => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  set:    (k, v) => localStorage.setItem(k, JSON.stringify(v)),
  remove: k      => localStorage.removeItem(k)
};

/* ── Dark mode ── */
const cfg = S.get('tehillim_settings') || {};
if (cfg.darkMode) document.documentElement.classList.add('dark');

// 2.2.14: הסרת טעמים — Unicode U+0591–U+05C7 (cantillation marks)
let hideCantillation = cfg.hideCantillation !== false; // ברירת מחדל: ללא טעמים
let showVerseNums   = cfg.verseNums !== false; // ברירת מחדל: מציג מספרי פסוקים
/* עדכון תווית כפתור סיימתי — לא פוגע בשורת timerNum/scoreNum בתוכו */
function setDoneBtnLabel(btn, text) {
  var lbl = document.getElementById('doneBtnText');
  if (lbl) lbl.textContent = text;
  else btn.textContent = text;
}

function stripCantillation(text) {
  if (!hideCantillation) return text;
  // מסיר רק טעמים (0591-05AF), לא ניקוד (05B0-05C7)
  return text.replace(/[֑-֯]/g, '');
}

/* ── Hebrew gematria ── */
function toGematria(n) {
  const specials = {15:'ט"ו', 16:'ט"ז', 115:'קט"ו', 116:'קט"ז'};
  if (specials[n]) return specials[n];
  const h = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const t = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const m = ['','ק','ר','ש','ת'];
  let r = '', x = n;
  if (x >= 100) { r += m[Math.floor(x/100)]; x %= 100; }
  if (x >= 10)  { r += t[Math.floor(x/10)];  x %= 10;  }
  r += h[x];
  if (r.length === 1) return r + '׳';
  return r.slice(0,-1) + '"' + r.slice(-1);
}

/* ── URL params / state ── */
const params  = new URLSearchParams(location.search);
const MODE    = params.get('mode') || 'normal';
let _pendingMishnah = parseInt(params.get('mishnah'), 10) || 0; // קפיצה למשנה ספציפית (פעם אחת)
let _pendingReview  = params.get('review') === '1';             // כניסה אוטומטית למבחן (חזרה מרווחת)

// פענוח מזהה פרק "Tractate.Perek" (לדוגמה "Berakhot.2")
function parseChap(str) {
  const p = Corpus.parseChapId(str);
  if (!p) return null;
  const t = Corpus.getTractate(p.tractate);
  if (!t || !(p.perek >= 1 && p.perek <= t.length)) return null;
  return { tractate: p.tractate, perek: p.perek };
}

// במצב אקראי — העדף פרקים שטרם נלמדו היום
function pickRandomChap() {
  const today = localDateStr();
  const db = S.get('tehillim_readings') || [];
  const doneToday = new Set((Array.isArray(db) ? db : Object.values(db||{})).filter(r => r.date === today && !r.partial).map(r => r.chap));
  const all = Corpus.flatChapters();
  const unread = all.filter(c => !doneToday.has(c.id));
  const pool = unread.length > 0 ? unread : all;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  return { tractate: pick.tractate, perek: pick.perek };
}

// מצב נוכחי: מסכת (מחרוזת) + פרק (מספר). המזהה לנתונים הוא Corpus.chapId(curTractate, chapNum).
let curTractate, chapNum;
(function initChap() {
  let p = parseChap(params.get('chap'));
  if (!p) {
    if (MODE === 'random')     p = pickRandomChap();
    else if (MODE === 'cycle') p = parseChap(S.get('mishnah_cycle_pos'));
    if (!p) p = { tractate: Corpus.tractates[0].id, perek: 1 };
  }
  curTractate = p.tractate;
  chapNum = p.perek;
})();
function curId() { return Corpus.chapId(curTractate, chapNum); }
function curTractateObj() { return Corpus.getTractate(curTractate); }

/* ── Hida session state (mode=hida) ── */
let _hidaSession   = null;  // { verses: [{letter,from,to},...], idx, name }
let _hidaVerseFrom = 0;     // פסוק התחלה (1-based) לפילטר
let _hidaVerseTo   = 0;     // פסוק סיום (1-based) לפילטר

if (MODE === 'hida') {
  _hidaSession = S.get('tehillim_hida_session');
  if (_hidaSession && _hidaSession.verses && _hidaSession.verses.length) {
    const first = _hidaSession.verses[_hidaSession.idx || 0];
    if (first) { _hidaVerseFrom = first.from; _hidaVerseTo = first.to; }
  }
}

/* ── Playlist state (mode=playlist) ── */
let playlist = null;        // מערך מזהי פרקים: ["Berakhot.1", "Berakhot.2", ...]
let playlistIdx = 0;
if (MODE === 'playlist') {
  const pl = S.get('tehillim_playlist');
  if (pl && pl.chaps && pl.chaps.length) {
    playlist = pl.chaps;
    // אם ה-URL מציין פרק מפורש — מצא את המיקום הנכון ברשימה
    const urlId = params.get('chap');
    if (urlId && playlist[0] === urlId) {
      // התחלה חדשה — תמיד מ-idx 0
      playlistIdx = 0;
    } else {
      playlistIdx = pl.idx || 0;
    }
    const pp = parseChap(playlist[playlistIdx]);
    if (pp) { curTractate = pp.tractate; chapNum = pp.perek; }
  }
}

let fontSize   = typeof cfg.fontSize === 'number' ? cfg.fontSize : 22;
let autoScroll = false;
let autoScrollRAF = null;
let autoScrollDelayTimer = null;
let autoScrollAccum = 0; // מצבר לגלילה חלקה

/* ── Timer state ── */
let timerSec   = 0;
let sessionPts = 0;
let lastActivity = Date.now();
let IDLE_MS = 3 * 60 * 1000;  // ברירת מחדל: 3 דק חוסר פעילות
function updateIdleMs() {
  IDLE_MS = 3 * 60 * 1000;
}
let timerInterval = null;
let idlePaused = false;
let isDone = false;
let hasReachedBottom = false;
let savedTimerSec = 0; // כמה שניות כבר נשמרו ל-tehillim_readings בפרק הנוכחי

/* ── Commentary state ── */
let commentaryOn   = false;
let commentaryType = 'bartenura'; // 'bartenura' | 'tosafot'
let currentCommData = null;      // מערך הפירוש לפרק הנוכחי

/* ── Keys ── */
const READ_KEY  = 'tehillim_readings';
const SCORE_KEY = 'tehillim_score';
const FAV_KEY   = 'tehillim_favs';
const MEM_KEY   = 'tehillim_mem';          // פרקים שנלמדו בע״פ במלואם (נגזר — לתאימות עם בחירה/היסטוריה/גמיפיקציה)
const MEM_M_KEY = 'tehillim_mem_m';        // משניות בודדות שסומנו "ידעתי בע״פ": ["Berakhot.2:3", ...]
const SAVED_KEY = 'tehillim_saved_verses';

/* ── Trim readings older than 365 days (runs once on load) ──
   Prevents localStorage overflow (~5-10 MB limit) and keeps
   the Firestore sync document well under the 1 MB limit.
   All features (history, challenges, graphs) need max 30 days. */
(function trimOldReadings() {
  try {
    const db = S.get(READ_KEY);
    if (!Array.isArray(db) || db.length === 0) return;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 365);
    const cutoffStr = localDateStr(cutoff); // 'YYYY-MM-DD'
    const trimmed = db.filter(r => r.date && r.date >= cutoffStr);
    if (trimmed.length < db.length) {
      S.set(READ_KEY, trimmed);
      console.log('[Tehilhon] trimOldReadings: removed', db.length - trimmed.length,
                  'records older than 365 days. Remaining:', trimmed.length);
    }
  } catch(e) { /* silent — never break the reader */ }
})();

/* ── Sefaria API + cache ── */
const CACHE_TTL = 7 * 24 * 60 * 60 * 1000;

async function fetchChapter(tractateId, perek) {
  const cKey = 'mishnah_cache_' + Corpus.chapId(tractateId, perek);
  const cached = S.get(cKey);
  if (cached && cached.he && (Date.now() - (cached.ts||0) < CACHE_TTL)) return cached;
  const resp = await fetch(
    'https://www.sefaria.org/api/texts/' + Corpus.apiRef(tractateId, perek) + '?lang=he&commentary=0&context=0'
  );
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const data = await resp.json();
  const entry = { he: data.he, heRef: data.heRef, ts: Date.now() };
  S.set(cKey, entry);
  return entry;
}

/* ── Commentary API + cache (ברטנורא כברירת מחדל) ── */
async function fetchCommentary(tractateId, perek, type) {
  const cKey = 'mishnah_comm_' + type + '_' + Corpus.chapId(tractateId, perek);
  const cached = S.get(cKey);
  if (cached && cached.data && (Date.now() - (cached.ts||0) < CACHE_TTL)) return cached.data;
  const resp = await fetch(
    'https://www.sefaria.org/api/texts/' + Corpus.commentaryRef(tractateId, perek, type) + '?lang=he&commentary=0&context=0'
  );
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const json = await resp.json();
  const data = json.he || [];
  S.set(cKey, { data, ts: Date.now() });
  return data;
}

function commTextForVerse(commData, idx) {
  if (!commData || idx >= commData.length) return '';
  const v = commData[idx];
  if (!v) return '';
  if (Array.isArray(v)) return v.filter(Boolean).join(' ');
  return String(v);
}

/* ── Load & render chapter ── */
async function loadChapter(tractateId, perek) {
  isDone = false;
  curTractate = tractateId;
  chapNum = perek;
  if (typeof updateIdleMs === 'function') updateIdleMs();
  // אפס מצב שינון בעת מעבר פרק
  if (shinunActive) {
    shinunLevel = 1;
    [1,2,3,4].forEach(i => document.getElementById('slvl'+i)?.classList.toggle('active', i===1));
    document.getElementById('shinunBanner').style.display = 'none';
    _testResults = {};
  }
  const today = localDateStr();
  const _cid = Corpus.chapId(tractateId, perek);
  const db = S.get(READ_KEY) || [];
  const alreadyDone = db.some(r => r.chap === _cid && r.date === today && !r.partial);

  // נקה דיאלוג אישור אם פתוח
  const qc = document.getElementById('quickConfirm');
  if (qc) qc.remove();
  // השהיה בגלילה אוטומטית בעת מעבר לפרק חדש
  if (autoScroll) startAutoScrollAfterDelay(3);
  const btn = document.getElementById('doneBtn');
  btn.style.display = '';
  if (alreadyDone) {
    isDone = true;
    hasReachedBottom = true;
    // פרק שכבר נקרא — פתוח מיד
    const _sett = JSON.parse(localStorage.getItem('tehillim_settings') || '{}');
    if (_sett.simpleMode !== false) {
      // מוד פשוט — הצג שני כפתורים
      btn.style.display = 'none';
      const _sb = document.getElementById('simpleDoneBtns');
      if (_sb) { _sb.style.display = 'flex'; _sb.style.gap = '10px'; _sb.style.width = '100%'; }
    } else {
      btn.classList.remove('locked');
      btn.classList.add('done');
      setDoneBtnLabel(btn, _rLang()==='en' ? '← Next chapter' : '← המשך לפרק הבא');
    }
    document.getElementById('readProgressBar').style.width = '100%';
    document.getElementById('readProgressBar').classList.add('full');
  } else {
    isDone = false;
    // נאפס את ה-progress (renderVerses יקרא resetReadProgress לאחר הרינדור)
    lockDoneBtn();
    document.getElementById('readProgressBar').style.width = '0%';
    document.getElementById('readProgressBar').classList.remove('full');
  }

  const _t = Corpus.getTractate(tractateId);
  const _tName = (_rLang()==='en') ? tractateId : (_t ? _t.he : tractateId);
  const _perekWord = _rLang()==='en' ? 'Chapter' : 'פרק';
  const _len = _t ? _t.length : perek;
  document.getElementById('chapTitle').textContent = _tName + ' · ' + _perekWord + ' ' + toGematria(perek);
  document.getElementById('chapNumDisp').textContent = _tName + ' ' + _perekWord + ' ' + toGematria(perek) + ' (' + perek + '/' + _len + ') ▾';
  document.getElementById('prevBtn').disabled = (!Corpus.prevChapter(tractateId, perek) && MODE === 'normal');
  document.getElementById('nextBtn').disabled = (!Corpus.nextChapter(tractateId, perek) && MODE === 'normal');
  updateFavMemButtons();

  const ta = document.getElementById('textArea');
  ta.innerHTML = '<div class="loading-msg"><div class="spinner"></div><div>' + (_rLang()==='en' ? 'Loading ' : 'טוען ') + _tName + ' ' + _perekWord + ' ' + toGematria(perek) + '...</div></div>';

  try {
    // טעינת פרק + פירוש במקביל אם פירוש פעיל
    currentCommData = null;
    const chapPromise = fetchChapter(tractateId, perek);
    const commPromise = commentaryOn ? fetchCommentary(tractateId, perek, commentaryType).catch(()=>null) : Promise.resolve(null);
    const [data, commData] = await Promise.all([chapPromise, commPromise]);
    currentCommData = commData;
    const verseCount = data.he ? data.he.length : 0;
    document.getElementById('chapRef').textContent = verseCount + (_rLang()==='en' ? ' mishnayot' : ' משניות');
    // הפעל שינון אם פעיל, אחרת קריאה רגילה
    if (shinunActive && shinunLevel > 1) renderShinunVerses(data.he, shinunLevel);
    else renderVerses(data.he, commData);
    // קפיצה למשנה ספציפית אם התבקשה דרך ה-URL (?mishnah=N) — פעם אחת בלבד
    if (_pendingMishnah) { const _m = _pendingMishnah; _pendingMishnah = 0; setTimeout(function(){ scrollToMishnah(_m, true); }, 250); }
    if (_pendingReview) { _pendingReview = false; setTimeout(function(){ if (!shinunActive) toggleShinunMode(); setShinunLevel(4); }, 300); }
  } catch(e) {
    ta.innerHTML = _rLang()==='en'
      ? '<div class="error-msg">⚠️ Error loading chapter<br>Check internet connection<br><button class="retry-btn" onclick="loadChapter(\'' + tractateId + '\',' + perek + ')">Try again</button></div>'
      : '<div class="error-msg">⚠️ שגיאה בטעינת הפרק<br>בדוק חיבור לאינטרנט<br><button class="retry-btn" onclick="loadChapter(\'' + tractateId + '\',' + perek + ')">נסה שוב</button></div>';
  }
}

function renderVerses(verses, commData, preserveScroll) {
  const ta = document.getElementById('textArea');
  const _prevScroll = ta.scrollTop;   // לשימור מיקום גלילה ברינדור-מחדש (פירוש/פונט/שינון)
  if (!verses || !verses.length) {
    ta.innerHTML = '<div class="error-msg">הפרק אינו זמין כעת.</div>';
    return;
  }

  // מצב חידא — הצג רק פסוקים from עד to (1-based)
  let filteredVerses = verses;
  let verseOffset = 0;  // offset כדי לשמור מספור נכון
  if (MODE === 'hida' && _hidaVerseFrom > 0 && _hidaVerseTo > 0) {
    verseOffset = _hidaVerseFrom - 1;
    filteredVerses = verses.slice(_hidaVerseFrom - 1, _hidaVerseTo);
    // הצג כותרת האות הנוכחית
    if (_hidaSession && _hidaSession.verses) {
      const cur = _hidaSession.verses[_hidaSession.idx || 0];
      if (cur) {
        const total = _hidaSession.verses.length;
        const step  = (_hidaSession.idx || 0) + 1;
        ta.insertAdjacentHTML('beforebegin',
          '<div id="hidaBanner" style="background:var(--primary-light);border-bottom:.5px solid var(--border);' +
          'padding:8px 16px;font-size:13px;color:var(--primary);font-weight:600;text-align:center;">' +
          'אות <b>' + cur.letter + '</b> — פסוקים ' + cur.from + '–' + cur.to +
          ' (' + step + '/' + total + ')</div>');
      }
    }
  }

  const commLabel = commentaryType === 'tosafot' ? 'תוספות יו"ט' : 'ברטנורא';
  const savedVerses = S.get(SAVED_KEY) || [];
  const memMSet = new Set(getMemM()); // משניות שסומנו "ידעתי בע״פ" (פר־משנה)
  const _cid = curId();
  // שמור פסוקים מסוננים למיפוי
  const _versesToRender = filteredVerses;
  ta.innerHTML = (ta.dataset.hidaBanner || '') + _versesToRender.map((v, i) => {
    delete ta.dataset.hidaBanner;
    const realIdx = i + verseOffset;  // אינדקס אמיתי בפרק
    let commHtml = '';
    if (commentaryOn && commData) {
      const ct = commTextForVerse(commData, i);
      if (ct && ct.trim()) {

      }
    }
    const isSaved = savedVerses.some(sv => sv.chap === curId() && sv.verse === realIdx+1);
    const isMemV  = memMSet.has(_cid + ':' + (realIdx+1));
    return '<div class="verse">' +
      (showVerseNums ? '<span class="verse-num">' + toGematria(realIdx+1) + '</span>' : '') +
      '<div class="verse-content">' +
      '<span class="verse-text" style="font-size:' + fontSize + 'px">' + stripCantillation(v) + '</span>' +
      commHtml +
      '</div>' +
      '<div class="verse-actions">' +
        '<button class="verse-mem-btn' + (isMemV ? ' marked' : '') + '" ' +
          'onclick="toggleMemVerse(' + (realIdx+1) + ',this)" ' +
          'title="ידעתי משנה זו בעל פה">' + (isMemV ? '★' : '☆') + '</button>' +
        '<button class="verse-bk-btn' + (isSaved ? ' saved' : '') + '" ' +
          'onclick="toggleSaveVerse(' + (realIdx+1) + ',this)" ' +
          'title="שמור פסוק">🔖</button>' +
        '<button class="verse-rec-btn" id="rec_' + (realIdx+1) + '" ' +
          'onclick="toggleRec(' + (realIdx+1) + ',this)" ' +
          'oncontextmenu="return delRec(' + (realIdx+1) + ',this)" ' +
          'title="הקלט את עצמך אומר את המשנה">🎙️</button>' +
      '</div>' +
      '</div>';
  }).join('') +
  '<div id="bottomSentinel" style="height:2px;width:100%;"></div>';
  if (preserveScroll) {
    // רינדר-מחדש (פירוש/פונט/שינון) — שמור על מיקום הגלילה ואל תאפס את התקדמות הקריאה
    ta.scrollTop = _prevScroll;
    if (!isDone) reattachBottomObserver();
  } else {
    ta.scrollTop = 0;
    if (!isDone) resetReadProgress(); // 2.2.11: skip reset if chapter already marked done
  }
  try { setTimeout(refreshRecButtons, 0); } catch(e){}
}

/* ── חיבור מחדש של ה-observer לאחר רינדר-מחדש, בלי לאפס את מצב "הגעת לסוף" ── */
function reattachBottomObserver() {
  const ta = document.getElementById('textArea');
  if (bottomObserver) { bottomObserver.disconnect(); bottomObserver = null; }
  if (hasReachedBottom) return; // כבר סומן כנקרא — אין צורך
  const sentinel = document.getElementById('bottomSentinel');
  if (!sentinel) return;
  const taRect = ta.getBoundingClientRect(), senRect = sentinel.getBoundingClientRect();
  if (senRect.bottom <= taRect.bottom + 4) { reachedBottom(); return; }
  bottomObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) reachedBottom();
  }, { root: ta, threshold: 0.01, rootMargin: '0px 0px 40px 0px' });
  bottomObserver.observe(sentinel);
}

/* ── Read progress — IntersectionObserver על sentinel ── */
let bottomObserver = null;

function resetReadProgress() {
  hasReachedBottom = false;
  const ta  = document.getElementById('textArea');
  const bar = document.getElementById('readProgressBar');
  bar.style.width = '0%';
  bar.classList.remove('full');

  // נתק observer קודם
  if (bottomObserver) { bottomObserver.disconnect(); bottomObserver = null; }

  // במצב hida — הפסוקים מעטים, תן ל-DOM להתעדכן ואז בדוק
  const delay = (MODE === 'hida') ? 150 : 0;
  setTimeout(function() {
    const sentinel = document.getElementById('bottomSentinel');
    if (!sentinel) { unlockDoneBtn(); return; } // fallback

    // אם הפרק קצר (sentinel כבר גלוי) — פתח מיד
    const taRect  = ta.getBoundingClientRect();
    const senRect = sentinel.getBoundingClientRect();
    if (senRect.bottom <= taRect.bottom + 4) {
      reachedBottom();
      return;
    }

    // פרק ארוך — IntersectionObserver יפעל ברגע שה-sentinel גלוי
    lockDoneBtn();
    bottomObserver = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) reachedBottom();
    }, { root: ta, threshold: 0.01, rootMargin: '0px 0px 40px 0px' });
    bottomObserver.observe(sentinel);
  }, delay);
}

function reachedBottom() {
  if (hasReachedBottom) return;
  hasReachedBottom = true;
  if (bottomObserver) { bottomObserver.disconnect(); bottomObserver = null; }
  const bar = document.getElementById('readProgressBar');
  bar.style.width = '100%';
  bar.classList.add('full');
  unlockDoneBtn();
  if (!isDone) showToast(_rLang()==='en' ? '✅ End of chapter!' : '✅ הגעת לסוף הפרק!');
}

function updateReadProgress() {
  if (isDone || hasReachedBottom) return;
  // עדכן progress bar בלבד (IntersectionObserver מטפל בפתיחה)
  const ta = document.getElementById('textArea');
  const scrollable = ta.scrollHeight - ta.clientHeight;
  if (scrollable <= 0) return;
  const pct = Math.min(100, Math.round(ta.scrollTop / scrollable * 100));
  document.getElementById('readProgressBar').style.width = pct + '%';
}

function lockDoneBtn() {
  const btn = document.getElementById('doneBtn');
  btn.classList.add('locked');
  btn.classList.remove('done');
  setDoneBtnLabel(btn, _rLang()==='en' ? '↓ Scroll to end of chapter' : '↓ גלול עד סוף הפרק');
  btn.style.display = '';

function unlockDoneBtn() {
  const btn = document.getElementById('doneBtn');
  btn.classList.remove('locked');
  if (isDone) {
    btn.classList.add('done');
    const _isEn = _rLang() === 'en';
    if (MODE === 'hida') {
      const sess = _hidaSession;
      const cur  = sess && sess.verses ? sess.idx || 0 : 0;
      const tot  = sess && sess.verses ? sess.verses.length : 1;
      setDoneBtnLabel(btn, cur + 1 < tot
        ? (_isEn ? '← Next letter (' + (cur+2) + '/' + tot + ')' : '← האות הבאה (' + (cur+2) + '/' + tot + ')')
        : (_isEn ? '✓ Reading by name complete' : '✓ סיום קריאה לפי שם'));
    } else {
      if (MODE === 'playlist') {
        const _pl = S.get('tehillim_playlist') || {};
        const _isHida = _pl.source === 'hida';
        const _hasNext = playlistIdx + 1 < (playlist||[]).length;
        if (_isHida) {
          setDoneBtnLabel(btn, _hasNext
            ? (_isEn ? '← Next letter (' + (playlistIdx+2) + '/' + playlist.length + ')' : '← האות הבאה (' + (playlistIdx+2) + '/' + playlist.length + ')')
            : (_isEn ? '✓ Reading by name complete' : '✓ סיום קריאה לפי שם'));
        } else {
          setDoneBtnLabel(btn, _hasNext
            ? (_isEn ? '← Next (' + (playlistIdx+2) + '/' + playlist.length + ')' : '← הבא ברשימה (' + (playlistIdx+2) + '/' + playlist.length + ')')
            : (_isEn ? '✓ Playlist complete' : '✓ סיום הרשימה'));
        }
      } else {
        setDoneBtnLabel(btn, MODE === 'random'
          ? (_isEn ? '🎲 Next random chapter' : '🎲 פרק אקראי הבא')
          : (_isEn ? '← Next chapter' : '← המשך לפרק הבא'));
      }
    }
  } else {
    // בדוק מוד פשוט
    const _us = JSON.parse(localStorage.getItem('tehillim_settings') || '{}');
    if (_us.simpleMode !== false) {
      btn.style.display = 'none';
      const _sb = document.getElementById('simpleDoneBtns');
      if (_sb) { _sb.style.display = 'flex'; _sb.style.gap = '10px'; _sb.style.width = '100%'; }
    } else {
      setDoneBtnLabel(btn, _rLang()==='en' ? '✓ Done with this chapter' : '✓ סיימתי פרק זה');
    }
  }
}

/* ── Auto scroll (requestAnimationFrame — חלק וסנכרן עם המסך) ── */
// מהירות גלילה — נטענת מ-Settings (1=איטית 2=רגילה 3=מהירה 4=מהירה מאוד)
const _SCROLL_SPEEDS = [0, 0.2, 0.4, 0.7, 1.2];
function _getScrollSpeed() {
  const lvl = ((S.get('tehillim_settings')||{}).scrollSpeed) || 2;
  return _SCROLL_SPEEDS[Math.min(4, Math.max(1, lvl))] || 0.4;
}

function scrollFrame() {
  if (!autoScroll) return;
  const ta = document.getElementById('textArea');
  autoScrollAccum += _getScrollSpeed();
  const steps = Math.floor(autoScrollAccum);
  if (steps > 0) {
    ta.scrollTop += steps;
    autoScrollAccum -= steps;
  }
  autoScrollRAF = requestAnimationFrame(scrollFrame);
}

function stopAutoScrollRAF() {
  if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
  clearTimeout(autoScrollDelayTimer);
  autoScrollAccum = 0;
}

function startAutoScrollAfterDelay(delaySec) {
  stopAutoScrollRAF();
  if (delaySec === 0) {
    autoScrollRAF = requestAnimationFrame(scrollFrame);
  } else {
    autoScrollDelayTimer = setTimeout(() => {
      if (autoScroll) autoScrollRAF = requestAnimationFrame(scrollFrame);
    }, delaySec * 1000);
  }
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  document.getElementById('scrollSw').classList.toggle('on', autoScroll);
  if (autoScroll) {
    startAutoScrollAfterDelay(0);
    showToast(_rLang()==='en' ? '▶ Auto-scroll — double-tap to stop' : '▶ גלילה אוטומטית — דאבל קליק לעצירה');
  } else {
    stopAutoScrollRAF();
    showToast(_rLang()==='en' ? '⏸ Scroll stopped' : '⏸ גלילה עצרה');
  }
}

/* ── Save partial reading progress (when navigating away mid-chapter) ── */
function saveReadingProgress() {
  if (isDone) return;  // finishChapter כבר טיפל בזה

  // כמה שניות לא נשמרו עדיין?
  const unsaved = timerSec - savedTimerSec;
  if (unsaved < 5) return;  // קצר מדי

  // נקודה על שאריות ≥10 שניות (fullBlocks ניתנו כבר ב-setInterval)
  const rem = unsaved % 20;
  if (rem >= 10) addScore(1);

  // שמור רק את ה-delta — לא את כל הזמן — כדי למנוע ספירה כפולה בדאשבורד
  const today = localDateStr();
  const db = S.get(READ_KEY) || [];
  db.push({ chap: curId(), date: today, secs: unsaved, pts: sessionPts, ts: Date.now(), partial: true });
  S.set(READ_KEY, db);
  savedTimerSec = timerSec;  // מסמן עד כמה נשמר
}

/* ── Navigation ── */
function navigate(dir) {
  saveReadingProgress();
  stopTimer();
  // חצים זזים לפרק סמוך ברצף — חוצה גבול מסכת
  let target = dir > 0 ? Corpus.nextChapter(curTractate, chapNum)
                       : Corpus.prevChapter(curTractate, chapNum);
  if (!target) {
    // wrap-around בקצה הקורפוס (סוף עוקצין ↔ תחילת ברכות)
    const all = Corpus.flatChapters();
    target = dir > 0 ? all[0] : all[all.length - 1];
  }
  curTractate = target.tractate; chapNum = target.perek;
  if (MODE === 'cycle') saveCyclePos();
  resetTimer();
  loadChapter(curTractate, chapNum);
  startTimer();
  const u = new URL(location.href);
  u.searchParams.set('chap', curId());
  history.replaceState({}, '', u);
}

function navigateRandom() {
  saveReadingProgress();
  stopTimer();
  const p = pickRandomChap();   // מעדיף פרקים שטרם נלמדו היום
  curTractate = p.tractate; chapNum = p.perek;
  resetTimer();
  loadChapter(curTractate, chapNum);
  startTimer();
  const u = new URL(location.href);
  u.searchParams.set('chap', curId());
  history.replaceState({}, '', u);
}

function getMemM() { return S.get(MEM_M_KEY) || []; }

// מספר המשניות בפרק הנוכחי (לפי הקורפוס, נפילה רכה למספר הפסוקים המוצגים)
function curPerekMishnayot() {
  let n = 0;
  try { n = Corpus.mishnayotIn(curTractate, chapNum) || 0; } catch(e) {}
  if (!n) n = document.querySelectorAll('#textArea .verse').length;
  return n;
}

// סנכרון הפרק לרשימת "פרקים שלמים בע״פ" (MEM_KEY) — נגזר ממצב המשניות
function syncPerekMem() {
  const cid = curId();
  const total = curPerekMishnayot();
  const memM = getMemM();
  let marked = 0;
  for (let k = 1; k <= total; k++) if (memM.includes(cid + ':' + k)) marked++;
  let mems = getMems();
  const has = mems.includes(cid);
  if (total > 0 && marked === total && !has) { mems.push(cid); S.set(MEM_KEY, mems); }
  else if ((marked < total || total === 0) && has) { mems = mems.filter(x => x !== cid); S.set(MEM_KEY, mems); }
  if (typeof Gamification !== 'undefined' && Gamification.syncMemorizedFromMems) {
    try { Gamification.syncMemorizedFromMems(); } catch(e) {}
  }
}

// סימון/ביטול משנה בודדת כ"ידעתי בע״פ"
function toggleMemVerse(verseNum, btn) {
  const cid = curId();
  const id  = cid + ':' + verseNum;
  let memM = getMemM();
  const i = memM.indexOf(id);
  const adding = (i === -1);
  if (adding) memM.push(id); else memM.splice(i, 1);
  S.set(MEM_M_KEY, memM);
  if (btn) {
    btn.classList.toggle('marked', adding);
    btn.textContent = adding ? '★' : '☆';
    if (adding) { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  }
  if (adding) {
    addScore(2);
    if (typeof Gamification !== 'undefined' && Gamification.addMaalot) Gamification.addMaalot(2, 'memorization');
    showToast(_rLang()==='en' ? '★ Mishnah marked — +2 points!' : '★ סומנה משנה בע״פ — +2 זכויות!');
  } else {
    showToast(_rLang()==='en' ? '☆ Mishnah unmarked' : '☆ סימון המשנה הוסר');
  }
  syncPerekMem();
  updateFavMemButtons();
}

// כפתור ☆ בסרגל — מסמן/מבטל את כל משניות הפרק בבת אחת
function toggleMem() {
  const cid = curId();
  const total = curPerekMishnayot();
  if (!total) return;
  let memM = getMemM();
  const allMarked = (function(){ for (let k=1;k<=total;k++) if (!memM.includes(cid+':'+k)) return false; return true; })();
  if (allMarked) {
    memM = memM.filter(x => !x.startsWith(cid + ':'));
    S.set(MEM_M_KEY, memM);
    showToast(_rLang()==='en' ? '☆ Whole chapter unmarked' : '☆ כל הפרק הוסר מהשינון');
  } else {
    let added = 0;
    for (let k=1;k<=total;k++) { const id=cid+':'+k; if (!memM.includes(id)) { memM.push(id); added++; } }
    S.set(MEM_M_KEY, memM);
    if (added) {
      addScore(2 * added);
      if (typeof Gamification !== 'undefined' && Gamification.addMaalot) Gamification.addMaalot(2 * added, 'memorization');
    }
    showToast(_rLang()==='en' ? ('★ ' + total + ' mishnayot marked') : ('★ כל הפרק סומן בע״פ (' + total + ' משניות)'));
  }
  syncPerekMem();
  // רענן את כוכבי המשניות המוצגים
  document.querySelectorAll('#textArea .verse-mem-btn').forEach((b, idx) => {
    const on = getMemM().includes(cid + ':' + (idx + 1));
    b.classList.toggle('marked', on);
    b.textContent = on ? '★' : '☆';
  });
  updateFavMemButtons();
}

/* ── Save verse ── */
function toggleSaveVerse(verseNum, btn) {
  const saved = S.get(SAVED_KEY) || [];
  const idx   = saved.findIndex(v => v.chap === curId() && v.verse === verseNum);
  if (idx === -1) {
    // שמור
    const cached = S.get('mishnah_cache_' + curId());
    const text   = (cached && cached.he) ? (cached.he[verseNum - 1] || '') : '';
    saved.push({
      chap:  curId(),
      verse: verseNum,
      text,
      chapRef:  (curTractateObj() ? curTractateObj().he : curTractate) + ' ' + toGematria(chapNum),
      verseRef: toGematria(verseNum),
      ts: Date.now()
    });
    S.set(SAVED_KEY, saved);
    btn.classList.add('saved');
    btn.classList.remove('pop');
    void btn.offsetWidth; // reflow לאנימציה
    btn.classList.add('pop');
    showToast(_rLang()==='en' ? '🔖 Verse saved!' : '🔖 הפסוק נשמר!');
  } else {
    // הסר
    saved.splice(idx, 1);
    S.set(SAVED_KEY, saved);
    btn.classList.remove('saved');
    showToast(_rLang()==='en' ? '🔖 Removed from saved verses' : '🔖 הוסר מהפסוקים השמורים');
  }
}

/* ── Scoring ── */
function addScore(pts) {
  sessionPts += pts;
  document.getElementById('scoreNum').textContent = '+' + sessionPts;
  const sc = S.get(SCORE_KEY) || { total: 0, today: 0, todayDate: '', daily: {} };
  const today = localDateStr();
  if (sc.todayDate !== today) { sc.today = 0; sc.todayDate = today; }
  sc.total   = (sc.total   || 0) + pts;
  sc.today   = (sc.today   || 0) + pts;
  if (!sc.daily) sc.daily = {};
  sc.daily[today] = (sc.daily[today] || 0) + pts;
  S.set(SCORE_KEY, sc);
}

/* ── Timer ── */
function fmt(s) {
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function resetTimer() {
  stopTimer();
  // 2.1.5: אם יש זכויות מהפרק הקודם, נשמור ל-accumulator לפני האיפוס
  if (sessionPts > 0) {
    try {
      const acc = JSON.parse(localStorage.getItem('tehillim_session_acc') || '{"pts":0,"chaps":0,"lastDone":false}');
      acc.pts = (acc.pts || 0) + sessionPts;
      acc.chaps = (acc.chaps || 0) + 1;
      acc.lastDone = !!isDone;
      acc.ts = Date.now();
      localStorage.setItem('tehillim_session_acc', JSON.stringify(acc));
    } catch(e) {}
  }
  timerSec = 0;
  sessionPts = 0;
  isDone = false;
  idlePaused = false;
  savedTimerSec = 0;
  lastActivity = Date.now();
  // עדכן IDLE_MS לפי הפרק הנוכחי
  if (typeof updateIdleMs === 'function') updateIdleMs();
  document.getElementById('timerNum').textContent = '0:00';
  document.getElementById('scoreNum').textContent = '+0';
  document.getElementById('idleWarning').style.display = 'none';
}

/* החזרת הזכויות החזויות: 5 לפרק שלם + 1 לכל 10 שניות (2.0.8) */
function projectedMaalot() {
  if (isDone) return sessionPts;
  // אם הטיימר עוד לא הגיע ל-10 שניות - מציג 0 (לא להראות +5 לפני שהתחיל לקרוא)
  if ((timerSec||0) < 10) return 0;
  const tenSecUnits = Math.floor((timerSec||0) / 10);
  return 5 + tenSecUnits;
}
function updateScoreDisplay() {
  if (isDone) return;
  document.getElementById('scoreNum').textContent = '+' + projectedMaalot();
}

function startTimer() {
  if (timerInterval) return;
  lastActivity = Date.now();
  timerInterval = setInterval(() => {
    updateScoreDisplay();
    // אם כבר במצב idle — לא מאפשרים חזרה דרך נגיעה במסך, רק במעבר לפרק חדש
    if (idlePaused) return;
    const idle = Date.now() - lastActivity;
    if (idle >= IDLE_MS) {
      idlePaused = true;
      document.getElementById('idleWarning').style.display = 'block';
      return;
    }
    timerSec++;
    document.getElementById('timerNum').textContent = fmt(timerSec);
    // מגבלת זמן מקסימלית: 3 דק' לפרק רגיל, 11 דק' לקי"ט
    const MAX_SECS = 180;
    if (timerSec >= MAX_SECS) {
      idlePaused = true;
      document.getElementById('idleWarning').style.display = 'block';
      return;
    }
    if (timerSec % 20 === 0) {
      addScore(1);
      saveTime(20);
    }
  }, 1000);
}

function stopTimer() {
  if (!timerInterval) return;
  clearInterval(timerInterval);
  timerInterval = null;
  const rem = timerSec % 20;
  if (rem > 0) saveTime(rem);
}

function saveTime(secs) {
  const rd = S.get('tehillim_reading') || {};
  const today = localDateStr();
  if (!rd.dailyMinutes) rd.dailyMinutes = {};
  if (!rd.dailyMinutes[today]) rd.dailyMinutes[today] = 0;
  rd.dailyMinutes[today] = +(rd.dailyMinutes[today] + secs/60).toFixed(3);
  S.set('tehillim_reading', rd);
}

/* ── Playlist navigation ── */
function navigatePlaylist() {
  if (!playlist) return;
  playlistIdx++;
  if (playlistIdx >= playlist.length) {
    // סיום הרשימה
    const pl = S.get('tehillim_playlist') || {};
    const src = pl.source;
    const msg = src === 'neshama' ? '🕯️ סיימת את הלימוד לעילוי נשמה — תהא נשמתו צרורה בצרור החיים'
              : src === 'refuah'  ? '💙 סיימת את הלימוד לרפואה שלמה'
              : src === 'hida'    ? '🎉 סיום לימוד לפי שם!'
              : '🎉 סיימת את כל המועדפים!';
    showToast(msg);
    const _back = (src === 'neshama' || src === 'refuah') ? '05-yizkor.html' : '02-selection.html';
    setTimeout(() => { location.href = _back; }, 2200);
    return;
  }
  const pl = S.get('tehillim_playlist') || {};
  pl.idx = playlistIdx;
  S.set('tehillim_playlist', pl);
  const pp = parseChap(playlist[playlistIdx]);
  if (pp) { curTractate = pp.tractate; chapNum = pp.perek; }
  resetTimer();
  loadChapter(curTractate, chapNum);
  startTimer();
  updatePlaylistBadge();
  const u = new URL(location.href);
  u.searchParams.set('chap', curId());
  history.replaceState({}, '', u);
}

/* ── Hida navigation ── */
function navigateHida() {
  if (!_hidaSession || !_hidaSession.verses) { navigate(1); return; }
  const nextIdx = (_hidaSession.idx || 0) + 1;
  if (nextIdx >= _hidaSession.verses.length) {
    // סיימנו את כל האותות
    S.remove && S.remove('tehillim_hida_session');
    localStorage.removeItem('tehillim_hida_session');
    showToast(_rLang()==='en' ? '🎉 Reading complete for ' + (_hidaSession.name || '') + '!' : '🎉 סיום קריאה לפי שם ' + (_hidaSession.name || '') + '!');
    setTimeout(() => { location.href = '02-selection.html'; }, 1500);
    return;
  }
  // עדכן index ועבור לקטע הבא
  _hidaSession.idx = nextIdx;
  S.set('tehillim_hida_session', _hidaSession);
  const next = _hidaSession.verses[nextIdx];
  _hidaVerseFrom = next.from;
  _hidaVerseTo   = next.to;
  // אפס מצב קריאה לאות החדשה

  hasReachedBottom = false;
  // מחק באנר קודם אם קיים
  const old = document.getElementById('hidaBanner');
  if (old) old.remove();
  // טען מחדש את הפרק הנוכחי עם הפסוקים החדשים (מצב חידא — לעיצוב מחדש ביזכור)
  loadChapter(curTractate, chapNum);
}

/* ── Mark done ── */
function markDone() {
  if (isDone) {
    // מצב חידא — עבור לקטע הבא
    if (MODE === 'hida') { navigateHida(); return; }
    if (MODE === 'playlist') navigatePlaylist();
    else if (MODE === 'random') navigateRandom();
    else navigate(1);
    return;
  }

  // לא הגיע לסוף — גלול שם
  if (!hasReachedBottom) {
    const ta = document.getElementById('textArea');
    ta.scrollTo({ top: ta.scrollHeight, behavior: 'smooth' });
    showToast(_rLang()==='en' ? '📖 Scroll to end of chapter first' : '📖 גלול עד לסוף הפרק תחילה');
    return;
  }

  // מהיר מדי — פחות מ-5 שניות
  if (timerSec < 5) {
    showQuickConfirm();
    return;
  }

  finishChapter();
}

function showQuickConfirm() {
  const btn = document.getElementById('doneBtn');
  btn.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'quick-confirm';
  wrap.id = 'quickConfirm';
  const _qcEn = _rLang() === 'en';
  wrap.innerHTML =
    '<button class="qc-back" onclick="dismissConfirm()">' + (_qcEn ? '📖 Back to reading' : '📖 אחזור לקרוא') + '</button>' +
    '<button class="qc-continue" onclick="skipChapter()">' + (_qcEn ? '← Skip chapter' : '← דלג לפרק הבא') + '</button>';
  btn.parentNode.insertBefore(wrap, btn);
  showToast(_rLang()==='en' ? 'Take time to read carefully? 🤔' : 'האם לא תרצה לקרוא את הפרק בעיון? 🤔');
}

function dismissConfirm() {
  const c = document.getElementById('quickConfirm');
  if (c) c.remove();
  document.getElementById('doneBtn').style.display = '';
}

// דילוג — המשתמש לחץ "סיימתי" לפני 5 שניות, בחר לעבור הלאה
// saveReadingProgress לא נקרא כאן כי timerSec < 5 (מוגן בתנאי פנימי)
function skipChapter() {
  dismissConfirm();
  stopTimer();
  if (MODE === 'random') navigateRandom();
  else navigate(1);
}

function finishChapter() {
  dismissConfirm();
  isDone = true;

  // === זכויות (2.0.8): 5 + (secs/10) ===
  let earned = 0;
  let gamMeta = null;
  if (typeof Gamification !== 'undefined' && Gamification.onChapterCompleted) {
    gamMeta = Gamification.onChapterCompleted(curId(), timerSec);
    earned = gamMeta && gamMeta.pts ? gamMeta.pts : (5 + Math.floor((timerSec||0)/10));
  } else {
    earned = 5 + Math.floor((timerSec||0)/10);
  }
  // 2.2.13: addScore רק את ה-DELTA בין מה ש-gamification חישב לבין מה שכבר נצבר ב-sessionPts
  // (כל 20 שניות נצברה כבר נקודה ב-sessionPts דרך ה-timer)
  const alreadyAccrued = sessionPts; // מה שנצבר ע"י הטיימר עד עכשיו
  if (earned > alreadyAccrued) {
    addScore(earned - alreadyAccrued); // רק הדלתא החסרה
  }
  // שמור pending toast להצגה בדשבורד הבא
  try {
    localStorage.setItem('tehillim_pending_toast', JSON.stringify({
      pts: sessionPts, // sessionPts אחרי ה-addScore הנ"ל = earned
      chap: curId(),
      ts: Date.now()
    }));
  } catch(e) {}

  const today = localDateStr();
  const db = S.get(READ_KEY) || [];
  const finalSecs = timerSec - savedTimerSec;
  db.push({ chap: curId(), date: today, secs: finalSecs > 0 ? finalSecs : timerSec, pts: sessionPts, ts: Date.now() });
  S.set(READ_KEY, db);
  savedTimerSec = timerSec;
  stopTimer();
  const btn = document.getElementById('doneBtn');
  btn.style.display = '';
  btn.classList.remove('locked');
  btn.classList.add('done');
  setDoneBtnLabel(btn, nextBtnLabel());

  // במוד פשוט — הצג שני כפתורים במקום אחד
  const settings = JSON.parse(localStorage.getItem('tehillim_settings') || '{}');
  if (settings.simpleMode !== false) {
    btn.style.display = 'none';
    const simpleBtns = document.getElementById('simpleDoneBtns');
    if (simpleBtns) { simpleBtns.style.display = 'flex'; simpleBtns.style.gap = '10px'; simpleBtns.style.width = '100%'; }
  }

  // 2.1.5: הטוסט מציג את sessionPts (אותו ערך כמו במונה בפינה)
  const _isEn = _rLang() === 'en';
  let toastMsg = _isEn ? '✨ Well done! +' + sessionPts + ' points' : '✨ כל הכבוד! +' + sessionPts + ' זכויות';
  if (gamMeta && gamMeta.levelUp) {
    toastMsg += _isEn ? ' · Level up: ' + (gamMeta.levelUp.icon||'') + ' ' + (gamMeta.levelUp.key||'') : ' · עלית לרמת ' + (gamMeta.levelUp.icon||'') + ' ' + (gamMeta.levelUp.key||'');
  }
  showToast(toastMsg);

  checkAndShowMedal();
  if (window._syncGroupStats) window._syncGroupStats();
  if (window._syncPublicStats) window._syncPublicStats(curId());
}

async function loadCommentaryForCurrentChapter() {
  // הצג loading על הפירושים (שמור פסוקים נוכחיים)
  const ta = document.getElementById('textArea');
  const loadingDivs = ta.querySelectorAll('.verse-content');
  loadingDivs.forEach(el => {
    const existing = el.querySelector('.verse-commentary');
    if (!existing) {
      const ld = document.createElement('div');
      ld.className = 'comm-loading';
      ld.textContent = _rLang()==='en' ? 'Loading commentary...' : 'טוען פירוש...';
      el.appendChild(ld);
    }
  });
  try {
    const commData = await fetchCommentary(curTractate, chapNum, commentaryType);
    currentCommData = commData;
    // רינדר מחדש עם פירוש
    const cached = S.get('mishnah_cache_' + curId());
    if (cached && cached.he) renderVerses(cached.he, commData, true);
  } catch(e) {
    showToast(_rLang()==='en' ? '⚠️ Error loading commentary' : '⚠️ שגיאה בטעינת הפירוש');

    ta.querySelectorAll('.comm-loading').forEach(el => el.remove());
  }
}

async function setCommType(type) {
  if (commentaryType === type) return;
  commentaryType = type;
  document.getElementById('commBtnBartenura').classList.toggle('active', type === 'bartenura');
  document.getElementById('commBtnTosafot').classList.toggle('active', type === 'tosafot');

  // רינדר מחדש עם הפרק הנוכחי ופירוש חדש
  const cached = S.get('mishnah_cache_' + curId());
  if (cached && cached.he) renderVerses(cached.he, null, true); // קודם כל נקה
  await loadCommentaryForCurrentChapter();
}

/* ── מעקב שליטה לכל פרק (נשמר ב-localStorage) ── */
const MASTERY_KEY  = 'mishnah_mastery';
const MASTERY_INFO = { 1:{t:'ארד',e:'🥉'}, 2:{t:'כסף',e:'🥈'}, 3:{t:'זהב',e:'🥇'} };
function getMasteryAll(){ return S.get(MASTERY_KEY) || {}; }
function getMastery(id){ return getMasteryAll()[id] || null; }
function recordMasteryScore(id, pct, perfectFirstPass){
  const all = getMasteryAll();
  const m = all[id] || { perfects:0, tests:0, bestPct:0, level:0 };
  m.tests   = (m.tests||0) + 1;
  m.bestPct = Math.max(m.bestPct||0, pct);
  if (perfectFirstPass) m.perfects = (m.perfects||0) + 1;
  m.level   = m.perfects>=3 ? 3 : m.perfects>=2 ? 2 : m.perfects>=1 ? 1 : 0;
  m.lastTest = localDateStr();
  all[id] = m; S.set(MASTERY_KEY, all);
  // חזרה מרווחת — תזמן את הפרק לחזרה (perfect מקדם, אחרת חוזר לתיבה הראשונה)
  if (typeof Gamification !== 'undefined' && Gamification.srsSchedule) {
    try { Gamification.srsSchedule(id, !!perfectFirstPass); } catch(e){}
  }
  return m;
}

/* ── הקראה קולית (Text-to-Speech) ── */
let _ttsOn = false, _ttsIdx = 0, _ttsMode = 'read', _ttsUnits = [], _ttsTimer = null, _ttsAnySpoke = false;
function _ttsSupported(){ return typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined'; }
function _stripForTts(s){ return (s||'').replace(/[֑-֯]/g,''); } // הסר טעמים

function _hebrewVoices(){

function _isFemaleVoiceName(name){ return /carmit|female|woman|girl|נקב|אישה|נשי/i.test(name||''); }
// בחירת קול + גובה לפי ההגדרה (ברירת מחדל: קול גברי)
function _applyTtsVoice(u){
  try {
    const s = S.get('tehillim_settings') || {};
    const choice = s.ttsVoice || 'male';
    const he = _hebrewVoices();
    let v = null, pitch = 1, rate = 0.9;
    if (choice === 'male') {
      v = he.find(x => !_isFemaleVoiceName(x.name)) || he[0] || null;
      pitch = 0.5; rate = 0.86; // גובה נמוך מאוד — נשמע גברי גם כשהקול הזמין נשי (כמו Carmit)
    } else if (choice === 'female') {
      v = he.find(x => _isFemaleVoiceName(x.name)) || he[0] || null;
      pitch = 1.25;
    } else {
      v = he.find(x => x.name === choice) || (speechSynthesis.getVoices()||[]).find(x => x.name === choice) || he[0] || null;
      pitch = 1;
    }
    if (v) u.voice = v;
    u.pitch = pitch;
    u.rate = rate;
  } catch(e){}
}
// חימום רשימת הקולות (חלק מהדפדפנים טוענים אסינכרונית)
try { if (typeof speechSynthesis !== 'undefined') { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); }; } } catch(e){}
function _ttsNoVoice(){ showToast(_rLang()==='en' ? '🔇 No Hebrew voice available on this device' : '🔇 אין קול עברי מותקן במכשיר זה'); }
function _ttsStop(){
  _ttsOn = false;
  if (_ttsTimer) { clearTimeout(_ttsTimer); _ttsTimer = null; }
  try { speechSynthesis.cancel(); } catch(e){}
  document.querySelectorAll('.verse.tts-speaking').forEach(el=>el.classList.remove('tts-speaking'));
  const b = document.getElementById('ttsBtn'); if(b) b.classList.remove('tts-on');
  document.querySelectorAll('.audio-opt.playing').forEach(el=>el.classList.remove('playing'));
}
// 🔊 — פתח/סגור את סרגל האודיו (קרא / אמור אחריי / לולאה)
function toggleTTS(){
  if (!_ttsSupported()){ showToast(_rLang()==='en'?'Speech not supported here':'הקראה קולית לא נתמכת במכשיר זה'); return; }
  const bar = document.getElementById('audioBar');

// התחל מצב אודיו: 'read' רצף · 'repeat' אמור-אחריי · 'loop' בלולאה
function ttsStart(mode){
  if (!_ttsSupported()){ _ttsNoVoice(); return; }
  _ttsStop();
  const cached = S.get('mishnah_cache_' + curId());
  const verses = (cached && cached.he) ? cached.he : (_shinunVerses.length ? _shinunVerses : null);
  if (!verses || !verses.length){ showToast('אין טקסט להקראה'); return; }
  _ttsMode = mode;
  _ttsUnits = [];
  if (mode === 'repeat') {
    verses.forEach((v, vi) => _splitSentences(v).forEach(s => _ttsUnits.push({ text:s, vIdx:vi })));
  } else {
    verses.forEach((v, vi) => _ttsUnits.push({ text:v, vIdx:vi }));
  }
  _ttsOn = true; _ttsIdx = 0; _ttsAnySpoke = false;
  document.getElementById('ttsBtn').classList.add('tts-on');
  document.querySelectorAll('.audio-opt').forEach(el=>el.classList.remove('playing'));
  const optBtn = document.getElementById('aopt_' + mode); if (optBtn) optBtn.classList.add('playing');
  try { speechSynthesis.cancel(); } catch(e){}
  showToast(mode==='repeat' ? '🗣️ אמור אחריי — חזור בקול אחרי כל משפט' : (mode==='loop' ? '🔁 הקראה בלולאה' : '▶ הקראה'), { dur: 3000 });
  _ttsSpeakNext();
}
function _ttsSpeakNext(){
  if (!_ttsOn) return;
  if (_ttsIdx >= _ttsUnits.length) {
    if (_ttsMode === 'loop') { _ttsIdx = 0; } else { _ttsStop(); return; }
  }
  const unit = _ttsUnits[_ttsIdx];
  const verseEls = document.querySelectorAll('#textArea .verse');
  document.querySelectorAll('.verse.tts-speaking').forEach(el=>el.classList.remove('tts-speaking'));
  const u = new SpeechSynthesisUtterance(_stripForTts(unit.text));
  u.lang = 'he-IL'; u.rate = 0.9;
  _applyTtsVoice(u);
  let _started = false;
  u.onstart = function(){
    _started = true; _ttsAnySpoke = true;
    const el = verseEls[unit.vIdx];
    if (el){ el.classList.add('tts-speaking'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
  };
  u.onend = function(){
    if (!_started && !_ttsAnySpoke && _ttsIdx === 0){ _ttsStop(); _ttsNoVoice(); return; }
    _ttsIdx++;
    if (_ttsMode === 'repeat') {
      const pause = Math.max(1400, _stripForTts(unit.text).length * 45); // המתנה לחזרת המשתמש
      _ttsTimer = setTimeout(function(){ if (_ttsOn) _ttsSpeakNext(); }, pause);
    } else {
      _ttsSpeakNext();
    }
  };
  u.onerror = function(){
    if (!_ttsAnySpoke){ _ttsStop(); _ttsNoVoice(); return; }
    _ttsIdx++; _ttsSpeakNext();
  };
  try { speechSynthesis.speak(u); } catch(e){ _ttsStop(); _ttsNoVoice(); }
}

/* ══════════════════════════════════════════
   הקלטה עצמית של משניות (MediaRecorder + IndexedDB)
══════════════════════════════════════════ */
let _recDB = null, _recActive = null, _recMR = null, _recChunks = [], _recStream = null, _recAudio = null, _recCancelled = false;
function _recOpenDB() {
  return new Promise((resolve, reject) => {
    if (_recDB) return resolve(_recDB);
    const req = indexedDB.open('mishnayon_rec', 1);
    req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('rec')) db.createObjectStore('rec'); };
    req.onsuccess = e => { _recDB = e.target.result; resolve(_recDB); };
    req.onerror = e => reject(e);
  });
}
function _recKey(verseNum) { return curId() + ':' + verseNum; }
async function _recGet(key) { const db = await _recOpenDB(); return new Promise((res,rej)=>{ const r=db.transaction('rec').objectStore('rec').get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function _recPut(key, blob) { const db = await _recOpenDB(); return new Promise((res,rej)=>{ const r=db.transaction('rec','readwrite').objectStore('rec').put(blob,key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function _recDelete(key) { const db = await _recOpenDB(); return new Promise((res,rej)=>{ const r=db.transaction('rec','readwrite').objectStore('rec').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
async function _recKeysForChap() { const db = await _recOpenDB(); return new Promise((res)=>{ const out=[]; const r=db.transaction('rec').objectStore('rec').openKeyCursor(); const pre=curId()+':'; r.onsuccess=e=>{ const c=e.target.result; if(c){ if(String(c.key).indexOf(pre)===0) out.push(String(c.key)); c.continue(); } else res(out); }; r.onerror=()=>res(out); }); }

async function refreshRecButtons() {
  if (typeof indexedDB === 'undefined') { document.querySelectorAll('.verse-rec-btn').forEach(b=>b.style.display='none'); return; }
  let keys = [];
  try { keys = await _recKeysForChap(); } catch(e){ return; }
  const have = new Set(keys);
  document.querySelectorAll('.verse-rec-btn').forEach(b => {
    const vn = b.id.replace('rec_','');
    if (have.has(_recKey(vn))) { b.classList.add('has-rec'); b.classList.remove('recording'); b.textContent='▶'; }
    else { b.classList.remove('has-rec','recording'); b.textContent='🎙️'; }
  });
}

async function toggleRec(verseNum, btn) {
  // אם מקליט כרגע את אותה משנה — עצור ושמור
  if (_recActive === verseNum && _recMR) { _recStopAndSave(); return; }
  // אם מקליט משנה אחרת — עצור קודם
  if (_recMR) { try { _recMR.stop(); } catch(e){} }
  // אם כבר יש הקלטה — נגן
  if (btn.classList.contains('has-rec')) {
    try {
      const blob = await _recGet(_recKey(verseNum));
      if (blob) { if (_recAudio) { try{_recAudio.pause();}catch(e){} } _recAudio = new Audio(URL.createObjectURL(blob)); _recAudio.play(); showToast(_rLang()==='en'?'▶ Playing your recording':'▶ משמיע את ההקלטה שלך'); }
    } catch(e){ showToast('שגיאה בהשמעה'); }
    return;
  }
  // אחרת — התחל הקלטה
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast('המכשיר אינו תומך בהקלטה'); return; }
  try {
    _recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _recMR = new MediaRecorder(_recStream);
    _recChunks = [];
    _recActive = verseNum; _recCancelled = false;
    _recMR.ondataavailable = e => { if (e.data && e.data.size) _recChunks.push(e.data); };
    _recMR.onstop = async () => {
      const cancelled = _recCancelled;
      if (_recStream) { _recStream.getTracks().forEach(t=>t.stop()); _recStream=null; }
      _recMR=null; _recActive=null; _recCancelled=false;
      if (cancelled) { showToast(_rLang()==='en'?'✕ Recording cancelled':'✕ ההקלטה בוטלה'); refreshRecButtons(); return; }
      try {
        const blob = new Blob(_recChunks, { type: (_recChunks[0] && _recChunks[0].type) || 'audio/webm' });
        if (blob.size > 0) { await _recPut(_recKey(verseNum), blob); showToast(_rLang()==='en'?'🎙️ Recording saved':'🎙️ ההקלטה נשמרה'); }
      } catch(e){ showToast('שגיאה בשמירת ההקלטה'); }
      refreshRecButtons();
    };
    _recMR.start();
    btn.classList.add('recording'); btn.classList.remove('has-rec'); btn.textContent='⏹';
    showToast(_rLang()==='en'?'🔴 Recording… tap=save · long-press=cancel':'🔴 מקליט… לחיצה=שמירה · לחיצה ארוכה=ביטול');
  } catch(e) { showToast(_rLang()==='en'?'Microphone permission denied':'אין הרשאת מיקרופון'); _recActive=null; _recMR=null; }
}
function _recStopAndSave() { if (_recMR) { try { _recMR.stop(); } catch(e){} } }
function _recCancel() { if (_recMR) { _recCancelled = true; try { _recMR.stop(); } catch(e){} } }

// לחיצה ארוכה / קליק-ימני על הכפתור: בזמן הקלטה=ביטול, אם יש הקלטה=מחיקה
async function delRec(verseNum, btn) {
  if (_recActive === verseNum && _recMR) { _recCancel(); return false; }
  if (!btn.classList.contains('has-rec')) return false;
  try { await _recDelete(_recKey(verseNum)); showToast(_rLang()==='en'?'🗑 Recording deleted':'🗑 ההקלטה נמחקה'); refreshRecButtons(); } catch(e){}
  return false; // מנע תפריט הקשר
}

function renderShinunVerses(verses, level) {
  _shinunVerses = verses;
  _testResults  = {};
  _v4State      = {};
  const ta = document.getElementById('textArea');

  if (level === 1) {
    _reviewSet = null; _passNum = 0;
    renderVerses(verses, null, true);
    return;
  }

  const idxs = _reviewSet || verses.map((_, k) => k);
  let html = '';
  if (_reviewSet) {
    html += `<div style="text-align:center;font-size:12px;color:#7B2FF7;font-weight:700;margin-bottom:10px;">↻ סבב חזרה ${_passNum} — נותרו ${idxs.length} משניות</div>`;
  }
  idxs.forEach(i => {
    const v = verses[i];
    const words = v.split(' ');
    let inner = '';

    if (level === 2) {
      // Hide last ~30% of words (min 1, max 4)
      const hideN = Math.max(1, Math.min(4, Math.round(words.length * 0.3)));
      const shown  = words.slice(0, words.length - hideN).join(' ');
      const hidden = words.slice(words.length - hideN).join(' ');
      inner = `<span class="verse-text" style="font-size:${fontSize}px">` +
        shown + ' ' +
        `<span class="cover-block" id="cb${i}" onclick="revealCover(${i},\`${hidden.replace(/`/g,"'")}\`)">${hidden}</span>` +
        `</span>`;

    } else if (level === 3) {
      const firstWord = words[0];
      inner = `<div class="verse-wrap tappable" id="vw${i}" onclick="revealVerse3(${i})">` +
        `<span class="verse-text" id="vt${i}" style="font-size:${fontSize}px">${firstWord} <span style="color:var(--text-muted)">...</span></span>` +
        `<div class="shinun-hint" id="vh${i}">הקש לגלות ←</div>` +
        `</div>`;

    } else if (level === 4) {
      inner = `<div class="verse-wrap tappable" id="vw${i}" onclick="revealVerse4(${i})">` +
        `<div class="verse-hidden-label" id="vhl${i}">משנה ${toGematria(i+1)} — הקש לגלות משפט אחר משפט 👆</div>` +
        `<span class="verse-text" id="vt${i}" style="font-size:${fontSize}px;display:none;"></span>` +
        `</div>`;

    } else if (level === 5) {
      // ראשי תיבות — כל מילה מוצגת באות ראשונה; הקשה חושפת אותה (חשיפה הדרגתית מילה-מילה)
      const wordsHtml = words.map((w, wi) =>
        `<span class="rt-word" onclick="revealRT(${i},${wi},this)">${(w.charAt(0)||w)}</span>`
      ).join(' ');
      inner = `<span class="verse-text" style="font-size:${fontSize}px">${wordsHtml}</span>`;

    } else if (level === 6) {
      // השלמת מילים אקראית — חלק מהמילים מוסתרות; הקשה חושפת
      const hideN = Math.max(1, Math.round(words.length * 0.4));
      const hideSet = _seededHide(words.length, hideN, i);
      const wordsHtml = words.map((w, wi) =>
        hideSet.has(wi)
          ? `<span class="cover-block" onclick="revealWordCover(${i},${wi},this)">${' '.repeat(Math.max(2,Math.min(w.length,6)))}</span>`
          : w
      ).join(' ');
      inner = `<span class="verse-text" style="font-size:${fontSize}px">${wordsHtml}</span>`;
    }

    html += `<div class="verse">` +
      (showVerseNums ? `<span class="verse-num">${toGematria(i+1)}</span>` : '') +
      `<div class="verse-content">${inner}</div>` +
      `</div>`;
  });

  html += '<div id="bottomSentinel" style="height:2px;width:100%;"></div>';
  ta.innerHTML = html;
  ta.scrollTop = 0;
  resetReadProgress();
}

/* Level 2 — reveal covered ending */
function revealCover(idx, text) {

function revealRT(vIdx, wIdx, el) {

/* Level 6 — השלמת מילים: חשוף מילה מוסתרת */
function revealWordCover(vIdx, wIdx, el) {
