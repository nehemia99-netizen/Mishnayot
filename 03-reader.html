/* בחירת אינדקסים אקראית-יציבה (אותו seed → אותו פיזור) */
function _seededHide(n, count, seed) {
  let s = ((seed + 1) * 2654435761) >>> 0;
  const idx = Array.from({ length: n }, (_, k) => k);
  for (let k = n - 1; k > 0; k--) {
    s = (s * 1103515245 + 12345) >>> 0;
    const j = s % (k + 1);
    const t = idx[k]; idx[k] = idx[j]; idx[j] = t;
  }
  return new Set(idx.slice(0, Math.min(count, n)));
}

/* Level 4 — reveal + self-assess */
// פיצול משנה למשפטים (לפי נקודה / נקודתיים) — בלי lookbehind לתאימות Safari
function _splitSentences(t) {
  t = (t || '').trim();
  const out = []; let cur = '';
  for (let k = 0; k < t.length; k++) {
    const ch = t[k]; cur += ch;
    if ((ch === '.' || ch === ':' || ch === '׃') && (k + 1 >= t.length || t[k+1] === ' ')) {
      const s = cur.trim(); if (s) out.push(s); cur = '';
    }
  }
  const tail = cur.trim(); if (tail) out.push(tail);
  return out.length ? out : [t];
}
function revealVerse4(idx) {
  const vw  = document.getElementById('vw' + idx);
  const vt  = document.getElementById('vt' + idx);
  const vhl = document.getElementById('vhl' + idx);
  if (!vt) return;
  let st = _v4State[idx];
  if (!st) { st = _v4State[idx] = { sents: _splitSentences(_shinunVerses[idx]), shown: 0 }; }
  if (vhl && vhl.style.display !== 'none') { vhl.style.display = 'none'; vt.style.display = 'block'; }
  if (st.shown < st.sents.length) st.shown++;
  const more = st.shown < st.sents.length;
  vt.innerHTML = '<span class="verse-text" style="font-size:' + fontSize + 'px">' +
    st.sents.slice(0, st.shown).join(' ') +
    (more ? ' <span style="color:var(--text-muted);font-size:13px;">… הקש למשפט הבא</span>' : '') +
    '</span>';
  if (more) return; // עוד יש משפטים — אל תציג הערכה עדיין
  // כל המשפטים נחשפו — עצור הקשה והצג הערכה
  vw.onclick = null;
  vw.classList.remove('tappable');
  if (document.getElementById('ar' + idx)) return;
  const row = document.createElement('div');
  row.className = 'assess-row';
  row.id = 'ar' + idx;
  row.innerHTML =
    `<button class="assess-btn assess-yes" onclick="assessVerse(${idx},true)">✓ ידעתי</button>` +
    `<button class="assess-btn assess-no"  onclick="assessVerse(${idx},false)">✗ לא ידעתי</button>`;
  vw.parentElement.appendChild(row);
}

function assessVerse(idx, knew) {
  _testResults[idx] = knew;
  const row = document.getElementById('ar' + idx);
  if (row) {
    row.innerHTML = knew
      ? '<div style="color:var(--green);font-size:12px;padding:4px 0;font-weight:600;">✓ מצוין!</div>'
      : '<div style="color:#C04040;font-size:12px;padding:4px 0;font-weight:600;">↩ חזור על המשנה</div>';
  }
  // האם סיימנו את כל המשניות בסבב הנוכחי?
  const setIdxs = _reviewSet || _shinunVerses.map((_, k) => k);
  const assessed = setIdxs.filter(i => i in _testResults).length;
  if (!setIdxs.length || assessed < setIdxs.length) return;

  const missed = setIdxs.filter(i => _testResults[i] === false);
  const total  = setIdxs.length;
  const knewN  = total - missed.length;
  const pct    = Math.round(knewN / total * 100);
  const banner = document.getElementById('shinunBanner');
  banner.style.display = 'block';

  const firstPass = (_reviewSet === null);
  if (firstPass) recordMasteryScore(curId(), pct, missed.length === 0);

  if (missed.length === 0) {
    let msg = firstPass
      ? `🎉 מושלם! ידעת את כל ${total} המשניות במעבר ראשון!`
      : `🎉 כל הכבוד! שיננת את כל הפרק!`;
    const m = getMastery(curId());
    if (m && m.level) {
      const mi = MASTERY_INFO[m.level];
      msg += `<div class="shinun-mastery">שליטה: ${mi.e} ${mi.t} · ${m.perfects} שינונים מושלמים</div>`;
    }
    banner.innerHTML = msg;
  } else {
    banner.innerHTML =
      `🎯 ידעת ${knewN} מתוך ${total} (${pct}%)` +
      `<br><button class="shinun-retry-btn" onclick="retryMissed()">↻ חזור על ${missed.length} שלא ידעת</button>`;
    banner._missed = missed;
  }
  banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function retryMissed() {
  const banner = document.getElementById('shinunBanner');
  const missed = (banner && banner._missed) ? banner._missed.slice() : [];
  if (!missed.length) return;
  _reviewSet = missed;
  _passNum   = (_passNum || 0) + 1;
  banner.style.display = 'none';
  renderShinunVerses(_shinunVerses, 4);
}

/* ── Medal system ── */
const MEDALS_DEF = [
  { level:'platinum', label:'פלטינה', emoji:'💎', minChaps:12, color:'#5A9E68', bonus:50 },
  { level:'gold',     label:'זהב',    emoji:'🥇', minChaps: 9, color:'#C8A800', bonus:35 },
  { level:'silver',   label:'כסף',    emoji:'🥈', minChaps: 6, color:'#909098', bonus:20 },
  { level:'bronze',   label:'ארד',    emoji:'🥉', minChaps: 3, color:'#CD7F32', bonus:10 },
];
const MEDAL_RANK = { bronze:1, silver:2, gold:3, platinum:4 };

// מספר הפרקים השלמים שנלמדו היום (ייחודיים)
function _todayChapCount() {
  const today = localDateStr();
  let db = [];
  try { db = JSON.parse(localStorage.getItem('tehillim_readings') || '[]'); } catch(e) {}
  const set = new Set();
  (Array.isArray(db) ? db : Object.values(db||{})).forEach(r => { if (r.date === today && !r.partial) set.add(String(r.chap)); });
  return set.size;
}

function checkAndShowMedal() {
  const todayChaps = _todayChapCount();
  const earned = MEDALS_DEF.find(m => todayChaps >= m.minChaps);
  if (!earned) return;

  const todayStr = localDateStr();
  const shown    = S.get('tehillim_medal_shown') || {};
  const shownRank = (shown.date === todayStr) ? (MEDAL_RANK[shown.level] || 0) : 0;
  if (MEDAL_RANK[earned.level] <= shownRank) return; // לא הישג חדש

  // שמור שהראינו את המדליה הזו היום
  S.set('tehillim_medal_shown', { date: todayStr, level: earned.level });

  // הוסף לרשומות המדליות
  const allEarned = S.get('tehillim_medals_earned') || [];
  allEarned.push({ level: earned.level, date: todayStr, chaps: todayChaps, ts: Date.now() });
  S.set('tehillim_medals_earned', allEarned);

  // הענק זכויות בונוס
  if (earned.bonus) {
    addScore(earned.bonus);
    if (typeof Gamification !== 'undefined' && Gamification.addMaalot) Gamification.addMaalot(earned.bonus, 'medal-bonus');
  }

  // הצג פופ-אפ אחרי רגע קצר
  setTimeout(() => showMedalPopup(earned), 600);
}

function showMedalPopup(m) {
  const overlay = document.createElement('div');
  overlay.className = 'medal-popup-overlay';
  overlay.id = 'medalPopup';
  overlay.innerHTML =
    '<div class="medal-popup">' +
      '<span class="medal-popup-emoji">' + m.emoji + '</span>' +
      '<div class="medal-popup-title">מדליה חדשה!</div>' +
      '<div class="medal-popup-name" style="color:' + m.color + '">מדליית ' + m.label + '</div>' +
      '<div class="medal-popup-desc">למדת ' + m.minChaps + '+ פרקי משנה היום 🎉</div>' +
      '<div class="medal-popup-btns">' +
        '<button class="medal-popup-close" onclick="closeMedalPopup()">המשך קריאה</button>' +
        '<button class="medal-popup-cert" style="background:' + m.color + '" onclick="viewMedalCert(\'' + m.level + '\')">צפה בתעודה ✨</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeMedalPopup(); });
}

function closeMedalPopup() {
  const p = document.getElementById('medalPopup');
  if (p) p.remove();
}

function viewMedalCert(level) {
  closeMedalPopup();
  location.href = '04-history.html?cert=' + level;
}

/* ── Exit session (finish & go back) ── */
function exitSession() {
  // 2.1.4: סיום חכם - אם גלל עד הסוף + 20+ שניות, סמן כפרק שלם
  if (!isDone && timerSec >= 10) {  // 2.2.23: הורד מ-20ל-10 שניות לפרקים קצרים
    try {
      const textArea = document.getElementById('textArea');
      if (textArea) {
        const scrolledToEnd = textArea.scrollTop + textArea.clientHeight >= textArea.scrollHeight - 50;
        if (scrolledToEnd) {
          // מסמן את הפרק כהושלם + זכויות (2.2.3: תוקן — לא היה מעניק זכויות)
          isDone = true;
          // זכויות — בדיוק כמו finishChapter()
          let earned = 0;
          if (typeof Gamification !== 'undefined' && Gamification.onChapterCompleted) {
            const gamMeta = Gamification.onChapterCompleted(curId(), timerSec);
            earned = gamMeta && gamMeta.pts ? gamMeta.pts : (5 + Math.floor((timerSec||0)/10));
          } else {
            earned = 5 + Math.floor((timerSec||0)/10);
          }
          addScore(earned);
          // שמור היסטוריה
          const today = localDateStr();
          const db = S.get(READ_KEY) || [];
          const finalSecs = timerSec - savedTimerSec;
          db.push({ chap: curId(), date: today, secs: finalSecs > 0 ? finalSecs : timerSec, pts: earned, ts: Date.now() });
          S.set(READ_KEY, db);
          savedTimerSec = timerSec;
        }
      }
    } catch(e) {}
  }
  // שמור pending_toast לפני יציאה - כולל סכימה מהסשן (אם קראת כמה פרקים)
  try {
    let totalPts = sessionPts;
    let chapsCount = sessionPts > 0 ? 1 : 0;
    let anyDone = !!isDone;
    // הוסף מה-accumulator (פרקים קודמים בסשן)
    const accRaw = localStorage.getItem('tehillim_session_acc');
    if (accRaw) {
      const acc = JSON.parse(accRaw);
      totalPts += (acc.pts || 0);
      chapsCount += (acc.chaps || 0);
      if (acc.lastDone) anyDone = true;
    }
    if (totalPts > 0) {
      localStorage.setItem('tehillim_pending_toast', JSON.stringify({
        pts: totalPts,
        chap: curId(),
        chaps: chapsCount,
        ts: Date.now(),
        partial: !anyDone && chapsCount === 1
      }));
    }
    // נקה את ה-accumulator
    localStorage.removeItem('tehillim_session_acc');
  } catch(e) {}
  saveReadingProgress();
  stopTimer();
  if (MODE === 'cycle') saveCyclePos();
  // חזרה לדף הנכון לפי המצב
  // חזרה לדף הנכון לפי המקור
  // אם הגיע מהדשבורד (mode=random, cycle, או referrer=dashboard או from=dashboard) → דשבורד
  // אם הגיע מבחירה ספציפית (mode=chap או mode=normal ממסך הבחירה) → בחירה
  const _fromDash = (MODE === 'random' || MODE === 'cycle' ||
    params.get('from') === 'dashboard' ||
    (document.referrer && document.referrer.includes('01-dashboard')));
  location.href = _fromDash ? '01-dashboard.html' : '02-selection.html';
}

function saveCyclePos() {
  if (MODE === 'cycle') S.set('mishnah_cycle_pos', curId());
}

/* ── Visibility / unload ── */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // המשתמש עזב — שמור התקדמות ועצור שעון
    saveReadingProgress();
    if (MODE === 'cycle') saveCyclePos();
    stopTimer();
  } else {
    // המשתמש חזר — הפעל מחדש (timerSec ממשיך מהמקום שעצר, savedTimerSec תקף)
    lastActivity = Date.now();
    if (!timerInterval && !isDone) startTimer();
  }
});
window.addEventListener('beforeunload', () => {
  saveReadingProgress();
  if (MODE === 'cycle') saveCyclePos();
  stopTimer();
});

/* ── Dedication banner ── */
function initDedication() {
  const ded = S.get('tehillim_dedication');
  if (!ded || !ded.name) return;
  const today = localDateStr();
  if (ded.date !== today) {
    // פג תוקף — נקה
    localStorage.removeItem('tehillim_dedication');
    return;
  }
  const banner = document.getElementById('dedicationBanner');
  const isNesh = (ded.type === 'neshama');
  document.getElementById('dedLabel').textContent = (isNesh ? 'לומד לעילוי נשמת ' : 'לומד לרפואת ') + ded.name;
  const sub = document.getElementById('dedSub');
  if (sub) sub.textContent = isNesh ? 'משנה — אותיות נשמה • פג בחצות' : 'לימוד לרפואה שלמה • פג בחצות';
  const ic = banner.querySelector('.ded-icon');
  if (ic) ic.textContent = isNesh ? '🕯️' : '💙';
  banner.style.display = 'flex';
}

function dismissDedication() {
  document.getElementById('dedicationBanner').style.display = 'none';
  localStorage.removeItem('tehillim_dedication');
  showToast(_rLang()==='en' ? '💙 Dedication complete' : '💙 ההקדשה הסתיימה');
}

/* ── Init ── */
initMode();
applyFontSize();
initDedication();
loadChapter(curTractate, chapNum);
startTimer(); // starts immediately, independent of network fetch
</script>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

  messagingSenderId: "445059664136",
  appId:             "1:445059664136:web:fec8a4f338fd326d3b04bd"
};
const _fbApp2 = getApps().length ? getApps()[0] : initializeApp(FB_CFG2);
const _db2    = getFirestore(_fbApp2);
const _auth2  = getAuth(_fbApp2);

const _S2 = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } } };

function _getUid2() {
  let uid = _S2.get('tehillim_uid');
  if (!uid) { uid = 'u_' + Math.random().toString(36).slice(2,9)+Date.now().toString(36); localStorage.setItem('tehillim_uid', JSON.stringify(uid)); }
  return uid;
}

// כתוב ל-leaderboard ול-chapReads בסיום פרק
// ── Firebase writes חסכוניות ──
// chapReads: מצבור מקומי, שולח ב-batch כל 10 פרקים או ב-beforeunload
// leaderboard: פעם אחת ביום בלבד
const _CHAP_READS_KEY = 'tehillim_chapReads_pending';
const _LEADER_SENT_KEY = 'tehillim_leader_sent_date';

// הוסף לצבר המקומי
function _queueChapRead(chap) {
  if (!chap) return;
  try {
    const q = JSON.parse(localStorage.getItem(_CHAP_READS_KEY) || '{}');
    q[String(chap)] = (q[String(chap)] || 0) + 1;
    localStorage.setItem(_CHAP_READS_KEY, JSON.stringify(q));
  } catch(e) {}
}

// שלח את כל הצבר ל-Firebase ואפס
async function _flushChapReads() {
  try {
    const q = JSON.parse(localStorage.getItem(_CHAP_READS_KEY) || '{}');
    if (!Object.keys(q).length) return;
    const uid = _getUid2();
    if (!uid) return;
    // שלח במקביל
    await Promise.all(Object.entries(q).map(([ch, cnt]) =>
      setDoc(doc(_db2, 'chapReads', ch), { count: increment(cnt) }, { merge: true })
    ));
    localStorage.removeItem(_CHAP_READS_KEY);
  } catch(e) { console.warn('flushChapReads:', e); }
}

// עדכן leaderboard — פעם אחת ביום
async function _syncLeaderboard() {
  try {
    const today = localDateStr();
    const lastSent = localStorage.getItem(_LEADER_SENT_KEY);
    if (lastSent === today) return; // כבר שלחנו היום
    const uid = _getUid2();
    if (!uid) return;
    const sc   = _S2.get('tehillim_score') || {};
    const sett = _S2.get('tehillim_settings') || {};
    const gUser = _S2.get('tehillim_google_user');
    let displayName = null;
    if (sett.leaderboard !== false) {
      displayName = sett.username || (gUser && gUser.displayName) || 'משתמש אנונימי';
    }
    await setDoc(doc(_db2, 'leaderboard', uid), {
      displayName, score: sc.total || 0, updatedAt: Date.now()
    }, { merge: true });
    localStorage.setItem(_LEADER_SENT_KEY, today);
  } catch(e) { console.warn('syncLeaderboard:', e); }
}

// ספירת פרקים שנצברו — שלח כל 10
let _pendingChapCount = 0;

window._syncPublicStats = async function(chap) {
  // צבור chapRead מקומית
  _queueChapRead(chap);
  _pendingChapCount++;
  // שלח ב-batch כל 10 פרקים
  if (_pendingChapCount >= 10) {
    _pendingChapCount = 0;
    await _flushChapReads();
  }
  // leaderboard — פעם ביום
  await _syncLeaderboard();
};

// שלח הכל לפני עזיבת הדף
window.addEventListener('beforeunload', () => { _flushChapReads(); });
window.addEventListener('pagehide', () => { _flushChapReads(); });

// קרא ל-_syncPublicStats מ-finishChapter (שנמצא ב-scope הראשי)
// נחכה עד ש-finishChapter יקרא ל-window._syncGroupStats ואז נשלח גם את הציבורי
const _origSyncGroup = window._syncGroupStats;

const _grp = (() => { try { return JSON.parse(localStorage.getItem('tehillim_group')); } catch(e) { return null; } })();
if (_grp && _grp.code) {
  const { initializeApp: _ia, getApps: _ga } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getFirestore: _gf, doc: _d, setDoc: _sd } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

  const fbApp = _ga().length ? _ga()[0] : _ia(FB_CFG2);
  const db    = _gf(fbApp);

  const S = {
    get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } }
  };

  function getUid() {
    let uid = S.get('tehillim_uid');
    if (!uid) {
      uid = 'u_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36);
      localStorage.setItem('tehillim_uid', JSON.stringify(uid));
    }
    return uid;
  }

  // Attach sync function to window so finishChapter() can call it
  window._syncGroupStats = async function() {
    try {
      const grp   = S.get('tehillim_group');
      if (!grp || !grp.code) return;
      const MY_ID = getUid();
      const today = localDateStr();
      const yesterday = localDateStr(new Date(Date.now()-86400000));
      const readings = S.get('tehillim_readings') || [];
      const sc       = S.get('tehillim_score')    || {};
      const rd       = S.get('tehillim_reading')  || {};
      const vis      = S.get('tehillim_visits')   || {};
      const sett     = S.get('tehillim_settings') || {};

      const todayDone = new Set(readings.filter(r => r.date===today && !r.partial).map(r=>r.chap));
      const allDone   = [...new Set(readings.filter(r=>!r.partial).map(r=>r.chap))];
      const todayMins  = ((rd.dailyMinutes||{})[today]||0);
      const todayScore = (sc.todayDate===today ? sc.today : 0)||0;
      const trendDelta = ((sc.daily||{})[today]||0) - ((sc.daily||{})[yesterday]||0);

      const stats = {
        displayName: sett.username || 'אנונימי',
        todayDate:   today,
        todayChaps:  todayDone.size,
        todayMins:   Math.round(todayMins),
        todayScore,
        totalScore:  sc.total||0,
        totalChaps:  allDone.length,
        trendDelta,
        visitCount:  vis.count||0,
        lastActive:  Date.now(),
        chapsDone:   allDone
      };
      await setDoc(doc(db, 'groups', grp.code, 'members', MY_ID), stats, { merge: true });
    } catch(e) {
      console.warn('Group sync failed:', e);
    }
  };
}
</script>
