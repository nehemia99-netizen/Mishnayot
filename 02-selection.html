<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משניון — בחירת משנה</title>
<style>
:root{--bg:#EEEDE8;--card:#fff;--text:#1A1A1A;--text-sec:#6B6B6B;--text-muted:#9E9E9E;--border:rgba(0,0,0,.12);--primary:#3A7D44;--primary-light:#E9F2E9;--surface:#F5F5F3;--green:#3B8C14;--green-light:#EBF5E5;}
html.dark{--bg:#111;--card:#1E1E1E;--text:#F0EFE9;--text-sec:#ABABAB;--text-muted:#666;--border:rgba(255,255,255,.09);--primary:#6FBF7A;--primary-light:#15291B;--surface:#272727;--green:#5DBF35;--green-light:#162A10;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;direction:rtl;}
.app{max-width:430px;width:100%;background:var(--card);min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:0;z-index:20;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;}
.search-icon-btn{width:32px;height:32px;border-radius:50%;border:.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;-webkit-tap-highlight-color:transparent;}
.topbar-left{display:flex;align-items:center;gap:6px;}
.back-btn{font-size:15px;color:var(--primary);border:1px solid var(--primary);background:var(--primary-light);border-radius:20px;padding:7px 16px;text-decoration:none;white-space:nowrap;font-weight:600;}

/* Tabs */
.tabs{display:flex;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:49px;z-index:19;flex-shrink:0;}
.tab{flex:1;padding:10px 2px;text-align:center;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;-webkit-tap-highlight-color:transparent;line-height:1.3;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

/* Tab content */
.tab-content{flex:1;overflow-y:auto;display:none;}
.tab-content.active{display:block;}

/* ── TAB 0: Books ── */
.book-section{padding:12px 16px 4px;}
.book-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.book-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.book-name{font-size:14px;font-weight:700;color:var(--text);}
.book-range{font-size:11px;color:var(--text-muted);margin-right:auto;}
.chap-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
.chap-cell{aspect-ratio:1;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:11px;color:var(--text);text-align:center;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .1s;line-height:1.2;padding:2px;}
.chap-cell:active{transform:scale(.92);}
/* מצבים — ניתן לשילוב */
.chap-cell.done{background:var(--green-light);color:var(--green);font-weight:600;}
.chap-cell.fav{border:1.5px solid #E53935;}
.chap-cell.fav:not(.done){background:#FFF0F0;color:#E53935;}
.chap-cell.mem{outline:2px solid #7B2FF7;outline-offset:-2px;border-radius:7px;}
.chap-cell.mem:not(.done):not(.fav){background:#F4EEFF;color:#7B2FF7;}
html.dark .chap-cell.fav:not(.done){background:#2A1010;}
html.dark .chap-cell.mem:not(.done):not(.fav){background:#1C1230;}
.chap-cell.today-chap{font-weight:700;}

/* Quick-row: שיר של יום + סבב פרקים */
.quick-row{display:flex;gap:8px;margin:12px 16px 0;}
.quick-card{flex:1;border-radius:14px;padding:12px 12px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;display:flex;flex-direction:column;gap:2px;transition:opacity .15s;}
.quick-card:active{opacity:.78;}
.qc-badge{font-size:10px;font-weight:600;letter-spacing:.4px;opacity:.7;margin-bottom:1px;}
.qc-name{font-size:16px;font-weight:800;line-height:1.1;}
.qc-sub{font-size:11px;opacity:.65;margin-top:2px;}
.qc-icon-big{font-size:22px;margin-bottom:3px;}
/* Daily card — כחול */
.qc-daily{background:var(--primary-light);border:.5px solid var(--primary);}
.qc-daily .qc-badge,.qc-daily .qc-name,.qc-daily .qc-sub{color:var(--primary);}
/* Cycle card — ירוק */
.qc-cycle{background:var(--green-light,#EBF5E5);border:.5px solid var(--green);position:relative;}
.qc-cycle .qc-badge,.qc-cycle .qc-name,.qc-cycle .qc-sub{color:var(--green);}
html.dark .qc-cycle{background:#1A2E14;}
/* Sequence card — סגול */
.qc-seq{background:#F5F0FF;border:.5px solid #7B2FF7;}
.qc-seq .qc-badge,.qc-seq .qc-name,.qc-seq .qc-sub{color:#7B2FF7;}
html.dark .qc-seq{background:#1C1235;}
.cycle-reset-btn{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--green);background:rgba(255,255,255,.55);color:var(--green);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .15s;}
html.dark .cycle-reset-btn{background:rgba(0,0,0,.35);}
.cycle-reset-btn.confirm{background:var(--green);color:#fff;font-size:10px;font-weight:700;width:38px;border-radius:10px;}
.divider-sm{height:.5px;background:var(--border);margin:12px 16px;}

/* Legend */
.legend{display:flex;gap:12px;padding:10px 16px 12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}

/* ── TAB 1: Schedule ── */
.schedule-toggle{display:flex;gap:6px;padding:12px 16px 10px;}
.sched-btn{flex:1;padding:8px;border-radius:10px;border:.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s;}
.sched-btn.active{background:var(--primary-light);border-color:var(--primary);color:var(--primary);font-weight:600;}

.day-nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;}
.day-nav-btn{width:34px;height:34px;border-radius:10px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.day-nav-btn:active{background:var(--primary-light);}
.day-info{text-align:center;flex:1;}
.day-name{font-size:15px;font-weight:700;color:var(--text);}
.day-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

.schedule-card{margin:0 16px 12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:.5px solid var(--border);}
.schedule-card-title{font-size:12px;color:var(--text-muted);margin-bottom:8px;}
.schedule-chap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.sch-cell{padding:9px 4px;border-radius:9px;border:.5px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;color:var(--text);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;transition:background .1s;}
.sch-cell:active{background:var(--primary-light);}
.sch-cell.done{background:var(--green-light);border-color:var(--green);}
.sch-cell.fav{border:1.5px solid #E53935;}
.sch-cell.fav:not(.done){background:#FFF0F0;}
.sch-cell.mem{outline:2px solid #7B2FF7;outline-offset:-2px;border-radius:8px;}
.sch-cell .sc-gem{font-size:13px;font-weight:700;color:var(--text);}
.sch-cell.done .sc-gem{color:var(--green);}
.sch-cell .sc-num{font-size:10px;color:var(--text-muted);}
.read-all-btn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:12px;border-radius:12px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;text-align:center;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.read-all-btn:active{opacity:.85;}

/* ── TAB 2: Favorites ── */
.section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;}
.section-title{font-size:14px;font-weight:600;color:var(--text);}
.section-count{font-size:12px;color:var(--text-muted);}
.fav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 8px;}
.fav-cell{padding:14px 6px;border-radius:12px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;-webkit-tap-highlight-color:transparent;min-height:64px;justify-content:center;}
.fav-cell:active{opacity:.75;}
.fav-cell .fc-gem{font-size:16px;font-weight:700;}
.fav-cell .fc-num{font-size:10px;color:var(--text-muted);}
.fav-cell.is-fav{border-color:#E53935;background:#FFF5F5;}
.fav-cell.is-mem{border-color:#7B2FF7;background:#F8F0FF;}
html.dark .fav-cell.is-fav{background:#2A1010;}
html.dark .fav-cell.is-mem{background:#1C1230;}
.empty-state{padding:30px 20px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.7;grid-column:1/-1;}
.empty-icon{font-size:32px;margin-bottom:8px;}
.play-all-btn{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,#E53935,#C62828);color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:.3px;}
.play-all-btn:active{opacity:.85;}

/* ── Search overlay ── */
.search-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.search-overlay.open{opacity:1;pointer-events:all;}
.search-sheet{background:var(--card);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:16px;max-height:80vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s;}
.search-overlay.open .search-sheet{transform:translateY(0);}
.search-input{width:100%;padding:12px 16px;border-radius:12px;border:.5px solid var(--border);background:var(--surface);font-size:16px;color:var(--text);font-family:system-ui,sans-serif;outline:none;direction:rtl;margin-bottom:8px;}
.search-input:focus{border-color:var(--primary);}
.search-hint{font-size:11px;color:var(--text-muted);padding:0 4px 10px;}
.search-results{overflow-y:auto;flex:1;}
.search-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.search-cell{padding:10px 4px;border-radius:10px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent;}
.search-cell:active{background:var(--primary-light);}
.search-cell.done{background:var(--green-light);border-color:var(--green);}
.search-cell .sc-gem{font-size:13px;font-weight:700;color:var(--text);}
.search-cell .sc-num{font-size:10px;color:var(--text-muted);}
.search-close{margin-top:12px;padding:11px;border-radius:12px;border:.5px solid var(--border);background:var(--surface);width:100%;cursor:pointer;font-size:14px;color:var(--text-sec);flex-shrink:0;}
.no-results{text-align:center;padding:30px;color:var(--text-muted);font-size:14px;}

/* ── Word search ── */
.ws-progress{padding:4px 2px 10px;}
.ws-prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:6px;}
.ws-prog-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .35s ease;}
.ws-prog-fill.done{background:var(--green);}
.ws-prog-label{font-size:11px;color:var(--text-muted);text-align:center;}
.ws-results{display:flex;flex-direction:column;gap:8px;}
.ws-card{padding:11px 12px;border-radius:12px;background:var(--surface);border:.5px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;}
.ws-card:active{border-color:var(--primary);background:var(--primary-light);}
.ws-card-header{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.ws-chap-label{font-size:15px;font-weight:700;color:var(--text);}
.ws-badge{font-size:11px;color:var(--primary);background:var(--primary-light);border-radius:8px;padding:2px 8px;font-weight:600;flex-shrink:0;}
.ws-arrow{margin-right:auto;color:var(--text-muted);font-size:14px;}
.ws-verses{display:flex;flex-direction:column;gap:0;}
.ws-verse-row{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-top:.5px solid var(--border);}
.ws-vnum{font-size:10px;color:var(--text-muted);flex-shrink:0;padding-top:3px;min-width:22px;text-align:left;}
.ws-vtext{font-size:13px;line-height:1.7;color:var(--text-sec);font-family:'David Libre','FrankRuehl','Times New Roman',serif;flex:1;overflow-wrap:anywhere;}
.srch-hl{background:#FFF3A0;color:#6B4700;border-radius:3px;padding:0 1px;font-weight:800;}
html.dark .srch-hl{background:#4A3800;color:#FFD060;}
.ws-more{font-size:11px;color:var(--text-muted);padding:5px 0 0;margin-top:2px;border-top:.5px solid var(--border);}
.ws-empty{text-align:center;padding:28px 16px;color:var(--text-muted);font-size:13px;line-height:1.8;}
.ws-empty-icon{font-size:36px;margin-bottom:8px;display:block;}
</style>

.order-section{margin:0 16px 10px;border:.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);}
.order-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.order-header:active{background:var(--surface);}
.order-name{font-size:15px;font-weight:700;color:var(--primary);}
.order-count{font-size:11px;color:var(--text-muted);}
.ord-chev{display:inline-block;transition:transform .2s;color:var(--text-muted);font-size:11px;margin-right:4px;}
.order-section.open .ord-chev{transform:rotate(90deg);}
.order-body{border-top:.5px solid var(--border);}
.tractate-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:.5px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.tractate-row:last-child{border-bottom:none;}
.tractate-row:active{background:var(--surface);}
.tractate-name{font-size:14px;color:var(--text);font-weight:500;}
.tractate-meta{font-size:11px;color:var(--text-muted);}
.perek-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:10px 16px 14px;background:var(--surface);border-bottom:.5px solid var(--border);}
.chap-cell{aspect-ratio:1;border-radius:8px;border:.5px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;color:var(--text);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .1s;}
.chap-cell:active{transform:scale(.92);}

html.dark .chap-cell.fav{background:#2A1010;}
html.dark .chap-cell.mem{background:#1C1230;}
.fav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
</style>

  <!-- Top bar -->

<script>
(function(){
  "use strict";

  // עוטף localStorage (מוגדר מקומית בכל דף — אינו ב-utils.js)
  var S = {
    get:    function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set:    function(k,v){ localStorage.setItem(k, JSON.stringify(v)); },
    remove: function(k){ localStorage.removeItem(k); }
  };

  function toGem(n){
    var sp={15:'ט"ו',16:'ט"ז'};
    if(sp[n])return sp[n];
    var h=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],t=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],m=['','ק','ר','ש','ת'];
    var r='',x=n;
    if(x>=100){r+=m[Math.floor(x/100)];x%=100;}
    if(x>=10){r+=t[Math.floor(x/10)];x%=10;}
    r+=h[x];
    return r.length===1?r+'׳':r.slice(0,-1)+'"'+r.slice(-1);
  }

  var today=localDateStr();
  var rawDb=S.get('tehillim_readings')||[];
  var readingDb=Array.isArray(rawDb)?rawDb:Object.values(rawDb||{});
  var doneToday=new Set(readingDb.filter(function(r){return r.date===today && !r.partial;}).map(function(r){return String(r.chap);}));
  var favs=new Set((S.get('tehillim_favs')||[]).map(String));
  var mems=new Set((S.get('tehillim_mem')||[]).map(String));

  window.openChap=function(id){ location.href='03-reader.html?chap='+id; };
  window.startCycle=function(){ location.href='03-reader.html?mode=cycle'; };

  function perekCells(tid){
    var t=Corpus.getTractate(tid),h='';
    var mastery=S.get('mishnah_mastery')||{};
    var MED={1:'🥉',2:'🥈',3:'🥇'};
    for(var p=1;p<=t.length;p++){
      var id=Corpus.chapId(tid,p),cls='chap-cell';
      if(doneToday.has(id))cls+=' done';
      if(favs.has(id))cls+=' fav';
      if(mems.has(id))cls+=' mem';
      var m=mastery[id];
      var medal=(m&&m.level&&MED[m.level])?('<span style="position:absolute;top:-5px;left:-3px;font-size:11px;line-height:1;">'+MED[m.level]+'</span>'):'';
      h+='<div class="'+cls+'" style="position:relative;overflow:visible;" onclick="openChap(\''+id+'\')">'+toGem(p)+medal+'</div>';
    }
    return h;
  }

  window.toggleOrder=function(id){
    var sec=document.getElementById('sec_'+id), el=document.getElementById('ord_'+id);
    var open=(el.style.display==='none');
    el.style.display=open?'block':'none';
    if(sec)sec.classList.toggle('open',open);
  };
  window.toggleTractate=function(tid){
    var el=document.getElementById('tr_'+tid);
    if(el.style.display!=='none'){ el.style.display='none'; return; }
    if(!el.getAttribute('data-built')){ el.innerHTML=perekCells(tid); el.setAttribute('data-built','1'); }
    el.style.display='grid';
  };

  function buildOrders(){
    var c=document.getElementById('ordersContainer'),html='';
    Corpus.orders.forEach(function(o){
      html+='<div class="order-section" id="sec_'+o.id+'">';
      html+='<div class="order-header" onclick="toggleOrder(\''+o.id+'\')"><span class="order-name">סדר '+o.he+'</span><span class="order-count">'+o.tractates.length+' מסכתות <span class="ord-chev">▸</span></span></div>';
      html+='<div class="order-body" id="ord_'+o.id+'" style="display:none">';
      o.tractates.forEach(function(tid){
        var t=Corpus.getTractate(tid);
        html+='<div class="tractate-row" onclick="toggleTractate(\''+tid+'\')"><span class="tractate-name">'+t.he+'</span><span class="tractate-meta">'+t.length+' פרקים</span></div>';
        html+='<div class="perek-grid" id="tr_'+tid+'" style="display:none"></div>';
      });
      html+='</div></div>';
    });
    c.innerHTML=html;
  }

  window.switchTab=function(i){
    var tabs=document.querySelectorAll('.tab');
    for(var j=0;j<tabs.length;j++){ tabs[j].classList.toggle('active',j===i); }
    document.getElementById('tab0').classList.toggle('active',i===0);
    document.getElementById('tab1').classList.toggle('active',i===1);
    if(i===1)buildFavs();
  };

  function favLabel(id){
    var p=Corpus.parseChapId(id); if(!p)return id;
    var t=Corpus.getTractate(p.tractate);
    return (t?t.he:p.tractate)+' '+toGem(p.perek);
  }

  window.buildFavs=function(){
    var favArr=Array.from(favs), memArr=Array.from(mems);
    document.getElementById('favCount').textContent=favArr.length+' פרקים';
    document.getElementById('memCount').textContent=memArr.length+' פרקים';
    document.getElementById('playAllWrap').style.display=favArr.length?'block':'none';
    document.getElementById('favGrid').innerHTML=favArr.length
      ? favArr.map(function(id){ return '<div style="cursor:pointer;padding:10px 6px;border:1px solid #E53935;border-radius:10px;background:#FFF0F0;color:#B02020;font-size:12px;text-align:center;font-weight:600;" onclick="openChap(\''+id+'\')">'+favLabel(id)+'</div>'; }).join('')
      : '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:24px;font-size:13px;line-height:1.7;">🤍 לחץ ❤️ בזמן לימוד כדי להוסיף פרקים למועדפים</div>';
    document.getElementById('memGrid').innerHTML=memArr.length
      ? memArr.map(function(id){ return '<div style="cursor:pointer;padding:10px 6px;border:1px solid #7B2FF7;border-radius:10px;background:#F4EEFF;color:#5B1FB0;font-size:12px;text-align:center;font-weight:600;" onclick="openChap(\''+id+'\')">'+favLabel(id)+'</div>'; }).join('')
      : '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:24px;font-size:13px;line-height:1.7;">★ לחץ ★ בזמן לימוד כדי לסמן פרקים ששיננת (+5 מעלות)</div>';
  };

  window.playAllFavs=function(){
    var favArr=Array.from(favs); if(!favArr.length)return;
    S.set('tehillim_playlist',{chaps:favArr,idx:0,source:'favs'});
    location.href='03-reader.html?chap='+favArr[0]+'&mode=playlist';
  };

  // cycle resume text
  (function(){
    var pos=S.get('mishnah_cycle_pos'), sub=document.getElementById('cycleSub');
    if(sub && pos){ var p=Corpus.parseChapId(pos); if(p){ var t=Corpus.getTractate(p.tractate); sub.textContent='ממשיך מ'+(t?t.he:'')+' פרק '+toGem(p.perek); } }
  })();

  // init — כל הסדרים סגורים; אם הגענו מלימוד פרק, נפתח את הסדר שלו
  buildOrders();
  (function autoOpenLast(){
    try {
      var last = S.get('mishnah_cycle_pos');
      if (!last) {
        var rd = S.get('tehillim_readings') || [];
        rd = Array.isArray(rd) ? rd : Object.values(rd||{});
        if (rd.length) last = rd[rd.length-1].chap;
      }
      var p = last && Corpus.parseChapId(last);
      if (p && Corpus.getTractate(p.tractate)) toggleOrder(Corpus.getTractate(p.tractate).order);
    } catch(e){}
  })();

})();
</script>
</body>
</html>
