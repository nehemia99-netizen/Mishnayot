name: Daily study push
on:
  schedule:
    - cron: '0 17 * * *'      # 17:00 UTC ≈ ערב בישראל
  workflow_dispatch: {}        # כפתור "Run workflow" לבדיקה ידנית מיידית
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i firebase-admin@12
      - name: Send daily push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/send-daily-push.js
