<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>תהילהון — מחולל רצף</title>
<style>
:root{--bg:#EEEDE8;--card:#fff;--text:#1A1A1A;--text-sec:#6B6B6B;--text-muted:#9E9E9E;--border:rgba(0,0,0,.12);--primary:#185FA5;--primary-light:#E6F1FB;--primary-border:#B5D4F4;--surface:#F5F5F3;--green:#3B8C14;}
html.dark{--bg:#111;--card:#1E1E1E;--text:#F0EFE9;--text-sec:#ABABAB;--text-muted:#666;--border:rgba(255,255,255,.09);--primary:#5AA8E8;--primary-light:#152436;--primary-border:#2A5580;--surface:#272727;--green:#5DBF35;}
*{box-sizing:border-box;margin:0;padding:0;direction:rtl;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);display:flex;justify-content:center;}
.app{max-width:430px;width:100%;background:var(--card);min-height:100vh;display:flex;flex-direction:column;}

/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:0;z-index:20;}
.back-btn{font-size:12px;color:var(--primary);border:.5px solid var(--primary);background:var(--primary-light);border-radius:20px;padding:5px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;}
.topbar-title{flex:1;text-align:center;font-size:16px;font-weight:700;color:var(--text);}
.count-badge{font-size:12px;color:var(--primary);background:var(--primary-light);border:.5px solid var(--primary-border);border-radius:20px;padding:4px 10px;min-width:44px;text-align:center;white-space:nowrap;}

/* Presets */
.presets{padding:10px 14px 6px;display:flex;flex-wrap:wrap;gap:7px;}
.preset-chip{font-size:12px;padding:5px 12px;border-radius:20px;border:.5px solid var(--border);color:var(--text-sec);cursor:pointer;background:var(--surface);white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.preset-chip:active{background:var(--primary-light);color:var(--primary);border-color:var(--primary);}
.preset-chip.clear{color:#B03020;}

/* Chapter grid */
.grid-wrap{padding:8px 12px 6px;flex:1;}
.grid-hint{font-size:11px;color:var(--text-muted);margin-bottom:8px;text-align:center;}

.chap-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
.cc{position:relative;aspect-ratio:1;border-radius:8px;border:.5px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s;user-select:none;}
.cc:active{opacity:.7;}
.cc-gem{font-size:10px;font-weight:600;color:var(--text);line-height:1;}
.cc-num{font-size:8px;color:var(--text-muted);line-height:1;margin-top:1px;}
.cc.done{background:rgba(59,140,20,.08);border-color:rgba(59,140,20,.3);}
.cc.done .cc-gem{color:var(--green);}

/* Selected state */
.cc.sel{background:var(--primary);border-color:var(--primary);}
.cc.sel .cc-gem{color:#fff;}
.cc.sel .cc-num{color:rgba(255,255,255,.7);}
.cc-order{position:absolute;top:1px;left:2px;font-size:7px;font-weight:800;color:rgba(255,255,255,.9);line-height:1;}

/* Bottom panel */
.bottom-panel{border-top:.5px solid var(--border);background:var(--card);padding:10px 14px 24px;flex-shrink:0;}
.seq-label{font-size:11px;color:var(--text-muted);margin-bottom:6px;}
.seq-strip{display:flex;gap:5px;overflow-x:auto;min-height:32px;align-items:center;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.seq-strip::-webkit-scrollbar{display:none;}
.seq-chip{flex-shrink:0;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-light);border:.5px solid var(--primary-border);border-radius:8px;padding:4px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.seq-chip:active{opacity:.6;}
.seq-empty{font-size:12px;color:var(--text-muted);font-style:italic;}
.start-btn{width:100%;margin-top:10px;padding:14px;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s,opacity .2s;}
.start-btn:disabled{opacity:.35;cursor:default;}
.start-btn:not(:disabled):active{opacity:.85;}

/* Toast */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(24,95,165,.92);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;z-index:99;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
<script src="utils.js?v=2.2.0"></script>
<script src="i18n.js?v=2.2.84" defer></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
<div class="app">

  <div class="topbar">
    <a class="back-btn" href="02-selection.html" data-i18n="seq.back">› חזרה</a>
    <div class="topbar-title" data-i18n="seq.title">🎼 מחולל רצף פרקים</div>
    <div class="count-badge" id="countBadge">0 פרקים</div>
  </div>

  <div class="presets">
    <div class="preset-chip" onclick="presetAll()" data-i18n="seq.all_psalms">📜 כל התהילים</div>
    <div class="preset-chip" onclick="presetFavs()" data-i18n="seq.favs">❤️ מועדפים</div>
    <div class="preset-chip" onclick="presetToday()" data-i18n="seq.today">📅 של היום</div>
    <div class="preset-chip" onclick="presetFirst50()">א–נ</div>
    <div class="preset-chip" onclick="presetMid50()">נא–ק</div>
    <div class="preset-chip" onclick="presetLast50()">קא–קנ</div>
    <div class="preset-chip clear" onclick="clearAll()" data-i18n="seq.clear">✕ נקה</div>
  </div>

  <div class="grid-wrap">
    <div class="grid-hint" data-i18n="seq.hint">לחץ על פרק להוסיפו לרצף · לחץ שנית להסירו</div>
    <div class="chap-grid" id="chapGrid"></div>
  </div>

  <div class="bottom-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
      <div class="seq-label" style="margin-bottom:0;" data-i18n="seq.order">סדר הקריאה:</div>
      <button id="clearAllBtn" onclick="clearAll()" style="display:none;font-size:12px;color:#B03020;background:rgba(176,48,32,.08);border:.5px solid rgba(176,48,32,.3);border-radius:14px;padding:4px 10px;cursor:pointer;font-family:inherit;">✕ בטל הכל</button>
    </div>
    <div class="seq-strip" id="seqStrip">
      <span class="seq-empty" data-i18n="seq.empty">טרם נבחרו פרקים</span>
    </div>
    <button class="start-btn" id="startBtn" disabled onclick="startReading()" data-i18n="seq.start_btn">▶ קרא ברצף</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const S = {
  get: k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

function toGem(n) {
  const sp = {15:'ט"ו',16:'ט"ז',115:'קט"ו',116:'קט"ז'};
  if (sp[n]) return sp[n];
  const h=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const t=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const m=['','ק','ר','ש','ת'];
  let r='',x=n;
  if(x>=100){r+=m[Math.floor(x/100)];x%=100;}
  if(x>=10){r+=t[Math.floor(x/10)];x%=10;}
  r+=h[x];
  return r.length===1?r+'׳':r.slice(0,-1)+'"'+r.slice(-1);
}

/* ── State ── */
let sequence = []; // ordered array of chapter numbers

/* ── Today's reading (daily Tehillim schedule) ── */
const MONTHLY = {
  1:{from:1,to:9},2:{from:10,to:17},3:{from:18,to:22},4:{from:23,to:28},5:{from:29,to:34},
  6:{from:35,to:38},7:{from:39,to:43},8:{from:44,to:48},9:{from:49,to:54},10:{from:55,to:59},
  11:{from:60,to:65},12:{from:66,to:68},13:{from:69,to:71},14:{from:72,to:76},15:{from:77,to:78},
  16:{from:79,to:82},17:{from:83,to:87},18:{from:88,to:89},19:{from:90,to:96},20:{from:97,to:103},
  21:{from:104,to:105},22:{from:106,to:107},23:{from:108,to:112},24:{from:113,to:118},
  25:{from:119,to:119},26:{from:120,to:134},27:{from:135,to:139},28:{from:140,to:144},
  29:{from:145,to:150},30:{from:145,to:150}
};
function getHebDay() {
  try {
    const s = new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric'}).format(new Date());
    const n = parseInt(s.replace(/[^\d]/g,''));
    return (n >= 1 && n <= 30) ? n : 1;
  } catch(e) { return 1; }
}

/* ── Done today set ── */
const todayKey = localDateStr();
const hist     = S.get('tehillim_history') || {};
const doneToday = new Set(Object.keys(hist).filter(k => hist[k] && hist[k].lastDate === todayKey).map(Number));

/* ── Build grid ── */
function buildGrid() {
  const grid = document.getElementById('chapGrid');
  let html = '';
  for (let n = 1; n <= 150; n++) {
    const isD  = doneToday.has(n);
    const selIdx = sequence.indexOf(n);
    const isSel  = selIdx !== -1;
    html += '<div class="cc' + (isD ? ' done' : '') + (isSel ? ' sel' : '') + '" id="cc' + n + '" onclick="toggleChap(' + n + ')">' +
      (isSel ? '<span class="cc-order">' + (selIdx + 1) + '</span>' : '') +
      '<span class="cc-gem">' + toGem(n) + '</span>' +
      '<span class="cc-num">' + n + '</span>' +
    '</div>';
  }
  grid.innerHTML = html;
}

/* ── Toggle chapter selection ── */
function toggleChap(n) {
  const idx = sequence.indexOf(n);
  if (idx === -1) {
    sequence.push(n);
    showToast('פרק ' + toGem(n) + ' נוסף לרצף');
  } else {
    sequence.splice(idx, 1);
  }
  buildGrid();
  renderStrip();
  updateUI();
}

/* ── Remove from strip ── */
function removeFromStrip(n) {
  sequence = sequence.filter(x => x !== n);
  buildGrid();
  renderStrip();
  updateUI();
}

/* ── Render bottom strip ── */
function renderStrip() {
  const strip = document.getElementById('seqStrip');
  if (!sequence.length) {
    strip.innerHTML = '<span class="seq-empty">טרם נבחרו פרקים</span>';
    return;
  }
  strip.innerHTML = sequence.map(n =>
    '<div class="seq-chip" onclick="removeFromStrip(' + n + ')" title="הסר">פרק ' + toGem(n) + '</div>'
  ).join('');
  // scroll to end to show latest
  setTimeout(() => { strip.scrollLeft = strip.scrollWidth; }, 50);
}

/* ── Update count badge & button ── */
function updateUI() {
  const cnt = sequence.length;
  document.getElementById('countBadge').textContent = cnt + (cnt === 1 ? ' פרק' : ' פרקים');
  document.getElementById('startBtn').disabled = cnt === 0;
  document.getElementById('startBtn').textContent = cnt > 0
    ? '▶ קרא ברצף — ' + cnt + ' פרקים'
    : '▶ קרא ברצף';
  // הצג/הסתר כפתור "בטל הכל"
  document.getElementById('clearAllBtn').style.display = cnt > 1 ? '' : 'none';
}

/* ── Presets ── */
function presetAll() {
  sequence = Array.from({length:150}, (_,i) => i+1);
  buildGrid(); renderStrip(); updateUI();
  showToast('נבחרו כל 150 הפרקים');
}
function presetFavs() {
  const favs = S.get('tehillim_favs');
  // תומך בשני פורמטים: מערך [23,91] או אובייקט {chapters:{23:true}}
  let arr = [];
  if (Array.isArray(favs)) arr = favs.slice().sort((a,b)=>a-b);
  else if (favs && favs.chapters) arr = Object.keys(favs.chapters).map(Number).filter(n=>favs.chapters[n]).sort((a,b)=>a-b);
  if (!arr.length) { showToast('אין פרקים מועדפים עדיין'); return; }
  sequence = arr;
  buildGrid(); renderStrip(); updateUI();
  showToast('נטענו ' + arr.length + ' מועדפים');
}
function presetToday() {
  const day = getHebDay();
  const r   = MONTHLY[day] || MONTHLY[1];
  sequence  = Array.from({length: r.to - r.from + 1}, (_,i) => r.from + i);
  buildGrid(); renderStrip(); updateUI();
  showToast('פרקי היום: ' + toGem(r.from) + (r.from !== r.to ? '–' + toGem(r.to) : ''));
}
function presetFirst50()  { sequence = Array.from({length:50}, (_,i)=>i+1);    buildGrid(); renderStrip(); updateUI(); }
function presetMid50()    { sequence = Array.from({length:50}, (_,i)=>i+51);   buildGrid(); renderStrip(); updateUI(); }
function presetLast50()   { sequence = Array.from({length:50}, (_,i)=>i+101);  buildGrid(); renderStrip(); updateUI(); }
function clearAll()       { sequence = []; buildGrid(); renderStrip(); updateUI(); }

/* ── Start reading ── */
function startReading() {
  if (!sequence.length) return;
  S.set('tehillim_playlist', { chaps: sequence, idx: 0, source: 'custom' });
  location.href = '03-reader.html?chap=' + sequence[0] + '&mode=playlist';
}

/* ── Toast ── */
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ── Init ── */
function init() {
  const s = S.get('tehillim_settings');
  if (s && s.darkMode) document.documentElement.classList.add('dark');
  buildGrid();
  renderStrip();
  updateUI();
}
init();
</script>
<script src="bottomnav.js?v=2.2.0"></script>
</body>
</html>
