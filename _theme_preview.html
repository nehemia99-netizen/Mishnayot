<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תצוגת ערכות נושא — משניון</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#EEEDE8;margin:0;padding:16px;direction:rtl;color:#1A1A1A;}
  h1{font-size:18px;text-align:center;margin:0 0 4px;}
  .sub{font-size:12px;color:#777;text-align:center;margin-bottom:18px;}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .demo{width:300px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.10);border:1px solid rgba(0,0,0,.06);}
  .demo-label{font-size:13px;font-weight:800;text-align:center;padding:9px;color:#fff;}
  .pad{padding:14px;}
  /* header */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:.5px solid rgba(0,0,0,.1);}
  .hdr .t{font-size:16px;font-weight:700;}
  .pill{font-size:11px;border-radius:20px;padding:4px 10px;}
  /* tabs */
  .tabs{display:flex;border-bottom:.5px solid rgba(0,0,0,.1);}
  .tab{flex:1;text-align:center;font-size:12px;padding:9px 2px;color:#999;border-bottom:2px solid transparent;}
  .tab.on{font-weight:700;}
  /* big CTA */
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;border-radius:16px;padding:16px;font-size:17px;font-weight:700;margin-bottom:10px;}
  /* secondary */
  .sec{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px;font-size:15px;font-weight:700;margin-bottom:10px;}
  /* grid of muted action buttons */
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
  .act{border-radius:12px;padding:12px 4px;text-align:center;font-size:12px;font-weight:600;}
  .act .ic{font-size:20px;display:block;margin-bottom:3px;}
  /* card */
  .card{border-radius:12px;padding:12px;font-size:13px;}
  .legend{font-size:11px;color:#888;margin-top:10px;text-align:center;}
  .stat{display:flex;justify-content:space-around;border-radius:12px;padding:10px;margin-bottom:10px;}
  .stat .n{font-size:18px;font-weight:800;}
  .stat .l{font-size:10px;opacity:.7;}
</style>
</head>
<body>
  <h1>משניון · השוואת ערכות נושא</h1>
  <div class="sub">אותם רכיבים בדיוק, בשלוש פלטות ירוקות — בחר את המועדפת</div>
  <div class="row" id="row"></div>

<script>
const THEMES = [
  { key:'1', name:'① ירוק מרווה סולידי (מומלץ)', primary:'#3A7D44', light:'#E9F2E9', border:'#BBD6BB',
    warmBg:'#F3EFE6', warmBd:'#CDBE9A', warmTx:'#7A6326', neutBg:'#EFF1EE', neutBd:'#C6CDC4', neutTx:'#4C5A4E' },
  { key:'2', name:'② ירוק זית עמוק', primary:'#2E5E34', light:'#E6EEE6', border:'#AFC9AF',
    warmBg:'#EFEADF', warmBd:'#C3B690', warmTx:'#6E5A22', neutBg:'#EAEDEA', neutBd:'#BFC8BF', neutTx:'#435044' },
  { key:'3', name:'③ ירוק-אפור מעושן', primary:'#5B7A63', light:'#EDF1ED', border:'#C7D3C9',
    warmBg:'#F0ECE3', warmBd:'#CCC0A6', warmTx:'#776641', neutBg:'#EEF0EE', neutBd:'#CBD2CC', neutTx:'#566159' },
];

function demo(t){
  return `
  <div class="demo">
    <div class="demo-label" style="background:${t.primary}">${t.name}</div>
    <div class="hdr">
      <div class="t" style="color:${t.primary}">משניון</div>
      <div class="pill" style="background:${t.light};color:${t.primary};border:.5px solid ${t.border}">ב׳ סיון</div>
    </div>
    <div class="tabs">
      <div class="tab on" style="color:${t.primary};border-bottom-color:${t.primary}">📚 סדרים</div>
      <div class="tab">❤️ מועדפים</div>
    </div>
    <div class="pad">
      <div class="cta" style="background:${t.primary}"><span style="font-size:24px">📖</span> למד את כל המשנה</div>
      <div class="sec" style="background:#fff;border:2px solid ${t.primary};color:${t.primary}">🗓️ פרק יומי</div>
      <div class="stat" style="background:${t.light};border:.5px solid ${t.border}">
        <div><div class="n" style="color:${t.primary}">🌱</div><div class="l" style="color:${t.primary}">מתחיל</div></div>
        <div><div class="n" style="color:${t.primary}">5</div><div class="l" style="color:${t.primary}">רצף ימים</div></div>
        <div><div class="n" style="color:${t.primary}">57</div><div class="l" style="color:${t.primary}">פרקים</div></div>
      </div>
      <div class="grid">
        <div class="act" style="background:${t.light};border:1px solid ${t.border};color:${t.primary}"><span class="ic">🔥</span>אתגרים</div>
        <div class="act" style="background:${t.warmBg};border:1px solid ${t.warmBd};color:${t.warmTx}"><span class="ic">🏆</span>הישגים</div>
        <div class="act" style="background:${t.neutBg};border:1px solid ${t.neutBd};color:${t.neutTx}"><span class="ic">👥</span>קהילה</div>
      </div>
      <div class="card" style="background:${t.light};border:.5px solid ${t.border};color:${t.primary}">
        🔥 פרקים לוהטים בקהילה · ברכות א׳ · שבת ז׳
      </div>
      <div class="legend">כפתור ראשי · לשונית פעילה · כרטיס סטטוס · כפתורי פעולה מעומעמים</div>
    </div>
  </div>`;
}
document.getElementById('row').innerHTML = THEMES.map(demo).join('');
</script>
</body>
</html>
