<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3A7D44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="משנתי">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
<title>משנתי — משניות שמורות</title>
<style>
:root{--bg:#EEEDE8;--card:#fff;--text:#1A1A1A;--text-sec:#6B6B6B;--text-muted:#9E9E9E;--border:rgba(0,0,0,.12);--primary:#3A7D44;--primary-light:#E9F2E9;--surface:#F5F5F3;--green:#3B8C14;--green-light:#EBF5E5;--gold:#C07A00;--gold-light:#FFF8E5;}
html.dark{--bg:#111;--card:#1E1E1E;--text:#F0EFE9;--text-sec:#ABABAB;--text-muted:#666;--border:rgba(255,255,255,.09);--primary:#6FBF7A;--primary-light:#15291B;--surface:#272727;--green:#5DBF35;--green-light:#1A2E14;--gold:#E0A040;--gold-light:#2A2010;}
*{box-sizing:border-box;margin:0;padding:0;direction:rtl;}
body{font-family:system-ui,sans-serif;background:var(--bg);display:flex;justify-content:center;}
.app{max-width:430px;width:100%;background:var(--card);min-height:100vh;}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:.5px solid var(--border);background:var(--card);position:sticky;top:0;z-index:10;}
.topbar-title{font-size:17px;font-weight:600;color:var(--text);}
.back-btn{font-size:15px;color:var(--primary);border:1px solid var(--primary);background:var(--primary-light);border-radius:20px;padding:7px 16px;text-decoration:none;font-weight:600;}

/* Hero / empty state */
.hero{padding:52px 24px;text-align:center;}
.hero-icon{font-size:52px;display:block;margin-bottom:14px;}
.hero-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
.hero-sub{font-size:13px;color:var(--text-sec);line-height:1.65;}
.go-read-btn{display:inline-block;margin-top:20px;padding:11px 26px;border-radius:14px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;text-decoration:none;}

/* Count bar */
.count-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:.5px solid var(--border);}
.count-label{font-size:13px;color:var(--text-sec);}
.count-num{font-size:13px;font-weight:700;color:var(--gold);}
.clear-all-btn{font-size:12px;color:#C04040;background:none;border:none;cursor:pointer;font-family:system-ui,sans-serif;padding:4px 8px;border-radius:8px;-webkit-tap-highlight-color:transparent;}
.clear-all-btn:active{background:#FFF0F0;}

/* Verse card */
.verse-card{padding:14px 16px;border-bottom:.5px solid var(--border);position:relative;}
.verse-card:last-child{border-bottom:none;}
.verse-text{font-family:'David Libre','FrankRuehl','Times New Roman',serif;font-size:17px;line-height:1.8;color:var(--text);margin-bottom:8px;}
.verse-meta{display:flex;align-items:center;justify-content:space-between;}
.verse-ref{font-size:12px;color:var(--text-muted);background:var(--surface);border-radius:8px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px;}
.verse-ref-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.verse-actions{display:flex;gap:6px;}
.read-link{font-size:12px;color:var(--primary);background:var(--primary-light);border:.5px solid var(--primary);border-radius:8px;padding:4px 10px;text-decoration:none;font-weight:600;}
.remove-btn{font-size:12px;color:var(--text-muted);background:var(--surface);border:.5px solid var(--border);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s;}
.remove-btn:active{background:#FFF0F0;color:#C04040;}

/* Date separator */
.date-sep{padding:10px 16px 4px;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--surface);border-bottom:.5px solid var(--border);}

/* Toast */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;z-index:100;white-space:nowrap;pointer-events:none;}
html.dark .toast{background:#F0EFE9;color:#1A1A1A;}
.toast.show{opacity:1;}
</style>
<script src="errlog.js?v=1.5.65"></script>
<script src="utils.js?v=2.2.0"></script>
<script src="i18n.js?v=2.2.90" defer></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
<div class="app">

  <div class="topbar">
    <a href="01-dashboard.html" class="back-btn" data-i18n="read.back">← בית</a>
    <div class="topbar-title" data-i18n="saved.title">🔖 משניות שמורות</div>
  </div>

  <div id="mainContent"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const S = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};

/* Dark mode */
const cfg = S.get('tehillim_settings') || {};
if (cfg.darkMode) document.documentElement.classList.add('dark');

const SAVED_KEY = 'tehillim_saved_verses';

/* Toast */
let toastTmr;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => t.classList.remove('show'), 2200);
}

/* Hebrew gematria (needed for display) */
function toGematria(n) {
  const specials = {15:'ט"ו', 16:'ט"ז', 115:'קט"ו', 116:'קט"ז'};
  if (specials[n]) return specials[n];
  const h = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const t = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const m = ['','ק','ר','ש','ת'];
  let r = '', x = n;
  if (x >= 100) { r += m[Math.floor(x/100)]; x %= 100; }
  if (x >= 10)  { r += t[Math.floor(x/10)];  x %= 10;  }
  r += h[x];
  if (r.length === 1) return r + '׳';
  return r.slice(0,-1) + '"' + r.slice(-1);
}

/* Date display (Hebrew-style) */
function fmtDate(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today - 86400000);
  const ds = d.toDateString();
  if (ds === today.toDateString()) return 'היום';
  if (ds === yesterday.toDateString()) return 'אתמול';
  return d.toLocaleDateString('he-IL', { day:'numeric', month:'long' });
}

/* Remove a single verse */
function removeVerse(idx) {
  const saved = S.get(SAVED_KEY) || [];
  saved.splice(idx, 1);
  S.set(SAVED_KEY, saved);
  showToast('🗑 המשנה הוסרה');
  render();
}

/* Clear all */
function clearAll() {
  if (!confirm('למחוק את כל המשניות השמורות?')) return;
  S.set(SAVED_KEY, []);
  showToast('🗑 כל המשניות נמחקו');
  render();
}

/* Main render */
function render() {
  const saved = (S.get(SAVED_KEY) || []).slice().reverse(); // newest first
  const container = document.getElementById('mainContent');

  if (!saved.length) {
    container.innerHTML = `
      <div class="hero">
        <span class="hero-icon">📜</span>
        <div class="hero-title">אין משניות שמורות עדיין</div>
        <div class="hero-sub">בזמן לימוד פרק, לחץ על 🔖<br>ליד כל משנה שמוצאת חן בעיניך — והיא תישמר כאן.</div>
        <a href="03-reader.html" class="go-read-btn">פתח קורא ←</a>
      </div>`;
    return;
  }

  let html = `
    <div class="count-bar">
      <div>
        <span class="count-num">${saved.length}</span>
        <span class="count-label"> משניות שמורות</span>
      </div>
      <button class="clear-all-btn" onclick="clearAll()">מחק הכל</button>
    </div>`;

  /* Group by date */
  let lastDate = '';
  saved.forEach((sv, displayIdx) => {
    // original index in saved array (reversed display → need original for deletion)
    const origIdx = (S.get(SAVED_KEY) || []).length - 1 - displayIdx;
    const dateStr = fmtDate(sv.ts || 0);

    if (dateStr !== lastDate) {
      html += `<div class="date-sep">${dateStr}</div>`;
      lastDate = dateStr;
    }

    const chapRef  = sv.chapRef  || toGematria(sv.chap);
    const verseRef = sv.verseRef || toGematria(sv.verse);

    html += `
      <div class="verse-card" id="vc${displayIdx}">
        <div class="verse-text">${sv.text || '(טקסט לא זמין)'}</div>
        <div class="verse-meta">
          <div class="verse-ref">
            <span class="verse-ref-dot"></span>
            ${chapRef}, משנה ${verseRef}
          </div>
          <div class="verse-actions">
            <a href="03-reader.html?chap=${sv.chap}" class="read-link">📖 פתח</a>
            <button class="remove-btn" onclick="removeVerse(${origIdx})">✕ הסר</button>
          </div>
        </div>
      </div>`;
  });

  container.innerHTML = html;
}

render();
</script>
<script src="bottomnav.js?v=2.2.0"></script>
</body>
</html>
