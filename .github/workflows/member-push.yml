name: New member push
on:
  schedule:
    - cron: '*/15 * * * *'   # כל 15 דקות — בדיקה אם הצטרפו חברים
  workflow_dispatch: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i firebase-admin@12
      - name: Notify new members
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node scripts/notify-new-members.js
